> the real estate admin accesses the scoring panel,</p><p><strong>When</strong> they consult the configuration,</p><p><strong>Then</strong> they must see the parameters used by the engine.</p>"},{"code":"E2","title":"Authorized modification","body":"<p><strong>Given</strong> the real estate admin modifies a parameter,</p><p><strong>When</strong> they save the changes,</p><p><strong>Then</strong> the system must validate and persist the new configuration.</p>"},{"code":"E3","title":"Future application","body":"<p><strong>Given</strong> new parameters are configured,</p><p><strong>When</strong> later evaluations are performed,</p><p><strong>Then</strong> the system must use the current configuration.</p>"}],"up":[{"id":"HU3","oneSided":false,"why":"E1 and E2 expose and persist &quot;the parameters used by the engine&quot;. This story's note: <em>&quot;Externalizes the rule weights currently hard-coded in <code>backend/app/scoring.py</code>.&quot;</em>","tag":"documented","backward":false},{"id":"HU33","oneSided":false,"why":"This story's note: <em>&quot;A parameter change is a recalculation trigger for HU 33.&quot;</em> E3 applies new parameters to later evaluations, which must be versioned rather than overwritten.","tag":"documented · B5","backward":false}],"down":[],"propUp":[],"propDown":[],"flag":null},"HU16":{"id":"HU16","kind":"story","title":"Evaluation Auditing","lede":"Documented for planning. Provides a record of actions performed on evaluations, ensuring traceability and easing the review of changes within the system.","sprint":"Sprint 2","status":"🗓 Planned","category":"Desirable","sp":3,"actor":"Real Estate Admin / Admin Dev","story":"<p><strong>As</strong> a real estate admin/dev, <strong>I want</strong> to have a record of actions performed on evaluations, <strong>in order to</strong> ensure traceability and ease the review of changes within the system.</p>","notes":"<ul><li>Supports the RNF <strong>Traceability</strong> attribute — see <span class=\"xref-ext\">Atributos de calidad</span>.</li><li>Pairs with the immutable versioning in <a class=\"xref\" data-go=\"HU33\" href=\"#HU33\">HU 33</a>: audit records <em>who/when</em>, HU 33 records <em>what changed</em>.</li><li>Data-model validated in <strong>Spike 2</strong>.</li></ul>","acs":[{"code":"E1","title":"Action recording","body":"<p><strong>Given</strong> an evaluation is created, updated, or reviewed,</p><p><strong>When</strong> the action occurs,</p><p><strong>Then</strong> the system must record the corresponding event.</p>"},{"code":"E2","title":"Responsible identification","body":"<p><strong>Given</strong> an action is recorded,</p><p><strong>When</strong> the real estate admin/dev consults the audit,</p><p><strong>Then</strong> they must see the responsible user and the date of the event.</p>"},{"code":"E3","title":"Chronological history","body":"<p><strong>Given</strong> events associated with an evaluation exist,</p><p><strong>When</strong> its history is displayed,</p><p><strong>Then</strong> they must be shown in chronological order.</p>"}],"up":[{"id":"HU3","oneSided":false,"why":"E1 records events on evaluations being created, updated, or reviewed; evaluations themselves are produced by HU 3 E5.","tag":"documented","backward":false}],"down":[{"id":"HU24","oneSided":false},{"id":"HU33","oneSided":false}],"propUp":[],"propDown":[],"flag":null},"HU17":{"id":"HU17","kind":"story","title":"Real Estate Project Catalog Management","lede":"Lets a real estate admin register and maintain a catalog of projects and link them to executives, so the system can recommend leads against projects that are actually available.","sprint":"Sprint 1","status":"🔜 Sprint 1","category":"Essential","sp":5,"actor":"Real Estate Admin","story":"<p><strong>As</strong> a real estate admin, <strong>I want</strong> to register and maintain a catalog of real estate projects and link them to executives, <strong>in order to</strong> let the system recommend leads according to the projects that are actually available.</p>","notes":"<ul><li>This catalog is the data source for the matching engine in <a class=\"xref\" data-go=\"HU13\" href=\"#HU13\">HU 13</a>.</li><li>Project attributes (comuna, price range, type) align with the <code>PRECIOS_REFERENCIA_UF</code> reference used by the scoring engine.</li></ul>","acs":[{"code":"E1","title":"Project creation","body":"<p><strong>Given</strong> the admin accesses the projects panel,</p><p><strong>When</strong> they enter name, real estate company, comuna, type, price range, and status,</p><p><strong>Then</strong> the system must save the project in the catalog.</p>"},{"code":"E2","title":"Data validation","body":"<p><strong>Given</strong> the real estate admin creates or edits a project,</p><p><strong>When</strong> they enter incomplete required data or inconsistent prices,</p><p><strong>Then</strong> the system must prevent saving until corrected.</p>"},{"code":"E3","title":"Linking with executives","body":"<p><strong>Given</strong> a project exists in the catalog,</p><p><strong>When</strong> the admin assigns executives,</p><p><strong>Then</strong> those executives must remain linked to the project.</p>"},{"code":"E4","title":"Project status","body":"<p><strong>Given</strong> a project is marked as sold out,</p><p><strong>When</strong> matching is executed,</p><p><strong>Then</strong> it must not generate new recommendations.</p>"}],"up":[],"down":[{"id":"HU13","oneSided":false}],"propUp":[],"propDown":[],"flag":{"id":"HU17","wiki":"next","evidence":["frontend/src/components/AdminProjectCatalog.jsx","frontend/src/services/projectService.js","frontend/src/services/projectValidation.js","supabase/migrations/20260729_project_catalog.sql"],"covered":["E1","E2","E3"],"not_located":["E4"],"mark":null}},"HU18":{"id":"HU18","kind":"story","title":"Lead Financial Evolution","lede":"Documented for planning. Lets a sales executive visualize a lead's financial evolution over time to detect contact and follow-up opportunities.","sprint":"Sprint 2","status":"🗓 Planned","category":"Desirable","sp":5,"actor":"Sales Executive","story":"<p><strong>As</strong> a sales executive, <strong>I want</strong> to visualize a lead's financial evolution, <strong>in order to</strong> detect contact and commercial follow-up opportunities.</p>","notes":"<ul><li>Depends on the versioned history from <a class=\"xref\" data-go=\"HU33\" href=\"#HU33\">HU 33</a> to reconstruct the evolution.</li><li>Complements the executive dashboard <a class=\"xref\" data-go=\"HU2\" href=\"#HU2\">HU 2</a> with a temporal view of each lead.</li></ul>","acs":[{"code":"E1","title":"Evaluation history","body":"<p><strong>Given</strong> a lead has performed more than one evaluation,</p><p><strong>When</strong> the executive accesses their profile,</p><p><strong>Then</strong> they must see the history of registered evaluations.</p>"},{"code":"E2","title":"Evolution visualization","body":"<p><strong>Given</strong> historical evaluations exist,</p><p><strong>When</strong> the executive reviews the lead's profile,</p><p><strong>Then</strong> the system must show changes in score, purchase capacity, or main blocker.</p>"},{"code":"E3","title":"Follow-up opportunity","body":"<p><strong>Given</strong> the lead improves their financial situation,</p><p><strong>When</strong> the system detects a relevant advance,</p><p><strong>Then</strong> it must allow flagging it as a contact opportunity.</p>"},{"code":"E4","title":"Comparator between evaluations","body":"<p><strong>Given</strong> the executive wants to compare evaluations of the same or a different lead,</p><p><strong>When</strong> they select two different evaluations,</p><p><strong>Then</strong> the system must show the comparisons between the profiles, clearly indicating the strengths and weaknesses of each evaluation.</p>"}],"up":[{"id":"HU2","oneSided":false,"why":"This story's note: <em>&quot;Complements the executive dashboard HU 2 with a temporal view of each lead.&quot;</em> E1 surfaces the history when &quot;the executive accesses their profile&quot; — that profile view belongs to HU 2.","tag":"inferred · S2","backward":false},{"id":"HU3","oneSided":false,"why":"E2 shows changes in &quot;score, purchase capacity, or main blocker&quot;, all of which are HU 3 outputs.","tag":"documented","backward":false},{"id":"HU33","oneSided":false,"why":"This story's note: <em>&quot;Depends on the versioned history from HU 33 to reconstruct the evolution.&quot;</em> E1 needs more than one retained evaluation, which HU 33 E2's immutability guarantees.","tag":"documented","backward":false}],"down":[],"propUp":[],"propDown":[],"flag":null},"HU19":{"id":"HU19","kind":"story","title":"Supporting Document Upload","lede":"Documented for planning. Lets pre-qualified leads upload financial supporting documents so the executive can validate the declared information.","sprint":"Sprint 2","status":"🗓 Planned","category":"Desirable","sp":5,"actor":"Sales Executive / Lead","story":"<p><strong>As</strong> an executive, <strong>I want</strong> pre-qualified users to upload financial receipts to the platform, <strong>in order to</strong> validate the declared information.</p>","notes":"<ul><li>File types, max size, storage mechanism, and access permissions are defined in <strong>Spike 2</strong>.</li><li>This is the first story that introduces document handling; earlier stages (<a class=\"xref\" data-go=\"HU1\" href=\"#HU1\">HU 1</a>) deliberately avoid document upload.</li><li>Uploaded documents feed the dossier export in <a class=\"xref\" data-go=\"HU21\" href=\"#HU21\">HU 21</a>.</li><li>Note the CLAUDE.md guardrail: no storage of bank credentials or highly sensitive documents.</li></ul>","acs":[{"code":"E1","title":"Upload of allowed files","body":"<p><strong>Given</strong> the lead wants to back up their information,</p><p><strong>When</strong> they upload documents in PDF, JPG, or PNG,</p><p><strong>Then</strong> the system must accept them if they meet the defined rules.</p>"},{"code":"E2","title":"Secure storage","body":"<p><strong>Given</strong> the user uploads financial documents,</p><p><strong>When</strong> the system stores them,</p><p><strong>Then</strong> they must remain linked to their profile securely.</p>"},{"code":"E3","title":"Visualization by executive","body":"<p><strong>Given</strong> an executive reviews a pre-qualified lead,</p><p><strong>When</strong> they access their profile,</p><p><strong>Then</strong> they must be able to view or download the allowed documents.</p>"}],"up":[{"id":"HU2","oneSided":false,"why":"E3 lets an executive reviewing &quot;a pre-qualified lead&quot; open their documents; that pre-qualified lead list is HU 2's dashboard.","tag":"documented","backward":false}],"down":[{"id":"HU21","oneSided":false}],"propUp":[],"propDown":[],"flag":null},"HU20":{"id":"HU20","kind":"story","title":"Economic Simulation with UF and Interest Rates","lede":"Documented for planning. Do not implement without explicit team instruction. Lets a lead see how changes in the UF or in interest rates affect their purchase capacity and monthly dividend, so they understand the financial risk of their scenario before advancing.","sprint":"Sprint 3","status":"🗓 Planned","category":"Optional","sp":3,"actor":"Lead","story":"<p><strong>As</strong> a person interested in buying a home, <strong>I want</strong> to visualize how changes in the UF or interest rates affect my purchase capacity, <strong>in order to</strong> understand the financial risks before advancing in the process.</p>","notes":"<ul><li>This story is the &quot;stress algorithm&quot; concept: simulating rate/UF shocks against the lead's profile.</li><li>It reuses the scoring engine's dividend and financial-burden logic rather than introducing a new model.</li><li>Related simulation stories: <a class=\"xref\" data-go=\"HU9\" href=\"#HU9\">HU 9</a> (compatibility/alternatives), <a class=\"xref\" data-go=\"HU25\" href=\"#HU25\">HU 25</a> (subsidies), <a class=\"xref\" data-go=\"HU26\" href=\"#HU26\">HU 26</a> (credit terms).</li><li><strong>Numbering note:</strong> documented as <code>HdU 6</code> (Stress Algorithm) in the E2 informe; renumbered to <code>HU 20</code> following the E4 plan.</li></ul>","acs":[{"code":"E1","title":"Interest-rate scenario","body":"<p><strong>Given</strong> the user has already received their assessment,</p><p><strong>When</strong> they select a scenario with different interest rates,</p><p><strong>Then</strong> the system must show how their purchase capacity and dividend change.</p>"},{"code":"E2","title":"UF-variation scenario","body":"<p><strong>Given</strong> the user views their assessment,</p><p><strong>When</strong> the system processes a simulated UF variation,</p><p><strong>Then</strong> it must show the estimated change in financing capacity.</p>"},{"code":"E3","title":"Financial-risk notification","body":"<p><strong>Given</strong> the user simulates a scenario with an interest-rate increase or UF variation,</p><p><strong>When</strong> the system detects that the estimated dividend or financial burden exceeds the threshold defined by the system's rules,</p><p><strong>Then</strong> it must show a risk alert indicating that the scenario could affect their payment capacity, and recommend alternatives such as increasing the down payment, adjusting the term, reducing the target property value, or evaluating available subsidies.</p>"},{"code":"E4","title":"Clear comparison","body":"<p><strong>Given</strong> the user reviews economic scenarios,</p><p><strong>When</strong> the system presents the results,</p><p><strong>Then</strong> it must clearly distinguish the current scenario from the simulated ones.</p>"}],"up":[{"id":"HU3","oneSided":false,"why":"E1 and E2 recompute purchase capacity and dividend under shifted rates. This story's note: <em>&quot;reuses the scoring engine's dividend and financial-burden logic rather than introducing a new model.&quot;</em>","tag":"documented","backward":false}],"down":[],"propUp":[],"propDown":[],"flag":null},"HU21":{"id":"HU21","kind":"story","title":"Dossier Export for Bank Assessment","lede":"Documented for planning. Lets a sales executive export a consolidated report with the lead's profile and documents, to speed up a future referral to formal banking institutions.","sprint":"Sprint 2","status":"🗓 Planned","category":"Optional","sp":3,"actor":"Sales Executive","story":"<p><strong>As</strong> a sales executive, <strong>I want</strong> to export a consolidated report with the lead's profile and their documents, <strong>in order to</strong> speed up a future referral to formal banking institutions.</p>","notes":"<ul><li>Requires the uploaded documents from <a class=\"xref\" data-go=\"HU19\" href=\"#HU19\">HU 19</a>.</li><li>Dossier content, format, and permissions are defined in <strong>Spike 2</strong>, taking care not to expose unnecessary sensitive information.</li></ul>","acs":[{"code":"E1","title":"Export from lead profile","body":"<p><strong>Given</strong> the executive reviews a prioritized prospect,</p><p><strong>When</strong> they select export dossier,</p><p><strong>Then</strong> the system must generate a digital file.</p>"},{"code":"E2","title":"Dossier content","body":"<p><strong>Given</strong> the dossier is generated,</p><p><strong>When</strong> the executive downloads it,</p><p><strong>Then</strong> it must include score detail, lead profile, and uploaded documents.</p>"},{"code":"E3","title":"Standardized format","body":"<p><strong>Given</strong> the dossier will be used for later review,</p><p><strong>When</strong> the file is generated,</p><p><strong>Then</strong> it must present the information in a clean and structured way.</p>"}],"up":[{"id":"HU19","oneSided":false,"why":"This story's note: <em>&quot;Requires the uploaded documents from HU 19.&quot;</em> E2 requires the dossier to include those documents.","tag":"documented","backward":false}],"down":[],"propUp":[],"propDown":[],"flag":null},"HU22":{"id":"HU22","kind":"story","title":"Commercial Report & Metrics","lede":"Documented for planning. Lets a sales executive download reports on evaluated leads, classifications, and pre-qualification rates to analyze the commercial performance of a real estate campaign.","sprint":"Sprint 2","status":"🗓 Planned","category":"Optional","sp":3,"actor":"Sales Executive","story":"<p><strong>As</strong> a sales executive, <strong>I want</strong> to download reports on evaluated leads, classifications, and pre-qualification rates, <strong>in order to</strong> analyze the commercial performance of the real estate campaign.</p>","notes":"<ul><li>Overlaps with the analytics in <a class=\"xref\" data-go=\"HU23\" href=\"#HU23\">HU 23</a> and the conversion dashboard <a class=\"xref\" data-go=\"HU27\" href=\"#HU27\">HU 27</a>; this story is the exportable, period-scoped commercial report.</li></ul>","acs":[{"code":"E1","title":"Lead-volume report","body":"<p><strong>Given</strong> an authorized user accesses the reports module,</p><p><strong>When</strong> they select a period,</p><p><strong>Then</strong> the system must show the volume of evaluated leads.</p>"},{"code":"E2","title":"Classifications and pre-qualification","body":"<p><strong>Given</strong> registered evaluations exist,</p><p><strong>When</strong> the report is generated,</p><p><strong>Then</strong> it must include obtained classifications and pre-qualification rates.</p>"},{"code":"E3","title":"Authorized download","body":"<p><strong>Given</strong> the report is available,</p><p><strong>When</strong> an authorized manager or executive downloads it,</p><p><strong>Then</strong> the system must allow exporting it in Excel or PDF format.</p>"}],"up":[{"id":"HU3","oneSided":false,"why":"E2 reports &quot;obtained classifications and pre-qualification rates&quot;, which exist only once HU 3 has scored leads.","tag":"documented","backward":false}],"down":[],"propUp":[],"propDown":[],"flag":null},"HU23":{"id":"HU23","kind":"story","title":"Event-Log Metrics Visualization and Analysis","lede":"Lets a real estate admin visualize the application's event logs (sign-in clicks, account creation, pre-assessments, user age, etc.) and derive metrics, charts, and preliminary analysis — while respecting consent.","sprint":"Sprint 1","status":"🔜 Sprint 1","category":"Important","sp":8,"actor":"Real Estate Admin","story":"<p><strong>As</strong> a real estate admin, <strong>I want</strong> to visualize the application's event logs (sign-in clicks, account creation, pre-assessments, the age of users who fill in the forms, etc.), <strong>in order to</strong> obtain metrics about users and thus perform data analysis and improve decision-making.</p>","notes":"<ul><li>E3 makes consent-gating a hard requirement of the logging layer — non-consented traffic is logged only as anonymous, consistent with <a class=\"xref\" data-go=\"HU1\" href=\"#HU1\">HU 1</a> E3.</li><li>This feeds the demographic/socioeconomic reporting in <a class=\"xref\" data-go=\"HU28\" href=\"#HU28\">HU 28</a> and the conversion dashboard <a class=\"xref\" data-go=\"HU27\" href=\"#HU27\">HU 27</a>.</li><li>Supports the RNF <strong>Traceability</strong> attribute — see <span class=\"xref-ext\">Atributos de calidad</span>.</li></ul>","acs":[{"code":"E1","title":"Data table visualization","body":"<p><strong>Given</strong> a commercial executive who wants to review the event logs,</p><p><strong>When</strong> they enter the log view,</p><p><strong>Then</strong> they must be able to visualize the different logs.</p>"},{"code":"E2","title":"Chart generation and data analysis for decision-making","body":"<p><strong>Given</strong> a commercial executive who wants to analyze data based on the tables,</p><p><strong>When</strong> they ask the page to generate charts about a data point or to compute a statistic (mean, median, mode, etc.),</p><p><strong>Then</strong> the requested charts and results must be shown.</p>"},{"code":"E3","title":"Personal data protection","body":"<p><strong>Given</strong> a user has not accepted the data consent,</p><p><strong>When</strong> they perform the pre-assessment or click through the page,</p><p><strong>Then</strong> their events must not appear in the log.</p>"},{"code":"E4","title":"Data explainability for decision-making","body":"<p><strong>Given</strong> a real estate admin,</p><p><strong>When</strong> they ask the page to generate metrics from the data collected by the log,</p><p><strong>Then</strong> the page must generate a preliminary explanation/analysis of the data to ease its comprehension.</p>"}],"up":[{"id":"HU1","oneSided":false,"why":"E3 excludes users who have not accepted consent. This story's note: consent-gating is <em>&quot;consistent with HU 1 E3&quot;</em>, where the consent flag originates.","tag":"documented · B10","backward":false},{"id":"HU3","oneSided":false,"why":"E1 and E2 log and chart pre-assessment events, which are produced by the scoring flow HU 3 defines.","tag":"documented","backward":false},{"id":"HU6","oneSided":false,"why":"HU 6's note: <em>&quot;Consent state set here gates event logging in HU 23 E3.&quot;</em> HU 1 supplies the initial flag; HU 6 lets the user change it, and the logging layer must honour the change.","tag":"inferred · S5","backward":true}],"down":[{"id":"HU27","oneSided":false},{"id":"HU28","oneSided":false}],"propUp":[],"propDown":[],"flag":{"id":"HU23","wiki":"next","evidence":[],"covered":[],"not_located":["E1","E2","E3","E4"],"note":"no event-log table or logging code found anywhere","mark":"behind"}},"HU24":{"id":"HU24","kind":"story","title":"Report Fraudulent Users/Leads","lede":"Documented for planning. Lets executives flag and remove fraudulent or inconsistent leads from the commercial dashboard, with full state tracking and audit — without irreversibly deleting their data.","sprint":"Sprint 3","status":"🗓 Planned","category":"Desirable","sp":5,"actor":"Sales Executive / Real Estate Admin","story":"<p><strong>As</strong> a sales executive, <strong>I want</strong> to remove fraudulent users from my executives' dashboard, <strong>in order to</strong> avoid possible fraud and loss of time and money for the sales executives.</p>","notes":"<ul><li>E7 aligns with the auditing story <a class=\"xref\" data-go=\"HU16\" href=\"#HU16\">HU 16</a>; E8 aligns with the immutability principle of <a class=\"xref\" data-go=\"HU33\" href=\"#HU33\">HU 33</a>.</li><li>Quick &quot;report inconsistency&quot; action is exposed on mobile — see <a class=\"xref\" data-go=\"HU30\" href=\"#HU30\">HU 30</a> E4.</li></ul>","acs":[{"code":"E1","title":"Detection of inconsistency indicators","body":"<p><strong>Given</strong> a lead completes a financial pre-assessment,</p><p><strong>When</strong> the system detects contradictory, incomplete, or unreliable information,</p><p><strong>Then</strong> it must mark the lead with a possible-inconsistency alert.</p>"},{"code":"E2","title":"Alert visualization in the dashboard","body":"<p><strong>Given</strong> a lead is marked with possible inconsistency or fraud,</p><p><strong>When</strong> the executive or admin views the dashboard,</p><p><strong>Then</strong> the system must show a visible label or warning on the lead's card.</p>"},{"code":"E3","title":"Manual report of suspicious lead","body":"<p><strong>Given</strong> an executive reviews a lead,</p><p><strong>When</strong> they detect suspicious, inconsistent, or possibly fraudulent information,</p><p><strong>Then</strong> they must be able to report it indicating a reason.</p>"},{"code":"E4","title":"State change of the reported lead","body":"<p><strong>Given</strong> a lead has been reported,</p><p><strong>When</strong> the real estate admin reviews the case,</p><p><strong>Then</strong> they must be able to change its status to &quot;Under review&quot;, &quot;Discarded for inconsistency&quot;, &quot;Confirmed fraud&quot;, or &quot;Reactivated&quot;.</p>"},{"code":"E5","title":"Commercial dashboard cleanup","body":"<p><strong>Given</strong> a lead was discarded for inconsistency or confirmed fraud,</p><p><strong>When</strong> executives view their lead portfolio,</p><p><strong>Then</strong> the system must hide or remove that lead from the main view of commercial opportunities.</p>"},{"code":"E6","title":"Report-status notification","body":"<p><strong>Given</strong> a report changes state,</p><p><strong>When</strong> the system updates the lead's review,</p><p><strong>Then</strong> it must notify or show the new status to the reporting user and the corresponding admin.</p>"},{"code":"E7","title":"Report audit record","body":"<p><strong>Given</strong> a lead is reported, discarded, reactivated, or has its status modified,</p><p><strong>When</strong> the action occurs,</p><p><strong>Then</strong> the system must store date, responsible, reason, and previous/subsequent status to maintain traceability.</p>"},{"code":"E8","title":"Prevention of irreversible deletion","body":"<p><strong>Given</strong> a lead is reported as fraudulent or inconsistent,</p><p><strong>When</strong> it is cleaned from the dashboard,</p><p><strong>Then</strong> the system must not automatically delete its information permanently, but keep it recorded for review, audit, or possible reactivation.</p>"}],"up":[{"id":"HU2","oneSided":false,"why":"E2 shows the warning &quot;on the lead's card&quot; and E5 removes discarded leads from the executive's portfolio — both are HU 2's dashboard.","tag":"documented","backward":false},{"id":"HU16","oneSided":false,"why":"E7 stores &quot;date, responsible, reason, and previous/subsequent status&quot;, which is HU 16's audit record. This story's note: <em>&quot;E7 aligns with the auditing story HU 16.&quot;</em>","tag":"inferred · S3","backward":false}],"down":[{"id":"HU30","oneSided":false}],"propUp":[],"propDown":[],"flag":null},"HU25":{"id":"HU25","kind":"story","title":"Housing Subsidy Simulation","lede":"Documented for planning. Lets a lead check or simulate whether they qualify for housing subsidies, to reduce the dividend and offset a lack of savings. Results are clearly referential.","sprint":"Sprint 3","status":"🗓 Planned","category":"Desirable","sp":5,"actor":"Lead","story":"<p><strong>As</strong> an interested lead, <strong>I want</strong> to check (or simulate) whether I qualify for subsidies automatically, <strong>in order to</strong> reduce the dividend value and offset a lack of savings.</p>","notes":"<ul><li>Subsidy rules and eligibility criteria are researched in <strong>Spike 1</strong> / validated in <strong>Spike 2</strong>.</li><li>A recalculated dividend (E2) is a scoring-recalculation trigger for <a class=\"xref\" data-go=\"HU33\" href=\"#HU33\">HU 33</a>.</li><li>Related simulations: <a class=\"xref\" data-go=\"HU20\" href=\"#HU20\">HU 20</a>, <a class=\"xref\" data-go=\"HU26\" href=\"#HU26\">HU 26</a>.</li></ul>","acs":[{"code":"E1","title":"Suggest evaluating the impact of subsidies","body":"<p><strong>Given</strong> the lead got a low score mainly due to their income level,</p><p><strong>When</strong> the system generates the assessment result,</p><p><strong>Then</strong> it must suggest exploring housing subsidies as an alternative to improve their access to a home.</p>"},{"code":"E2","title":"Recalculate score (dividend) based on the subsidy","body":"<p><strong>Given</strong> the lead chooses to explore the subsidy,</p><p><strong>When</strong> they simulate the purchase,</p><p><strong>Then</strong> the system recalculates the dividend applying the benefit.</p>"},{"code":"E3","title":"Referential nature of the subsidy simulation","body":"<p><strong>Given</strong> the user views a housing-subsidy simulation,</p><p><strong>When</strong> the system shows the results,</p><p><strong>Then</strong> it must clearly indicate that the information is referential, does not guarantee obtaining the subsidy, and does not replace the official evaluation by the corresponding entities.</p>"},{"code":"E4","title":"Subsidy options based on entered data","body":"<p><strong>Given</strong> the user entered information such as income, available savings, comuna of interest, and real estate objective,</p><p><strong>When</strong> the system evaluates the possibility of applying for a housing subsidy,</p><p><strong>Then</strong> it must show the compatible or potentially compatible subsidy options, indicating the estimated benefit and the main conditions to meet.</p>"}],"up":[{"id":"HU3","oneSided":false,"why":"E1 triggers when &quot;the lead got a low score mainly due to their income level&quot;; both the score and its drivers come from HU 3.","tag":"documented","backward":false},{"id":"HU33","oneSided":false,"why":"This story's note: <em>&quot;A recalculated dividend (E2) is a scoring-recalculation trigger for HU 33.&quot;</em>","tag":"documented · B4","backward":false}],"down":[],"propUp":[],"propDown":[],"flag":null},"HU26":{"id":"HU26","kind":"story","title":"Credit-Term Variation Simulation","lede":"Documented for planning. Lets a lead simulate their credit at 20-, 25-, and 30-year terms to find the balance between monthly installment and credit lifetime.","sprint":"Sprint 3","status":"🗓 Planned","category":"Optional","sp":3,"actor":"Lead","story":"<p><strong>As</strong> a lead interested in buying, <strong>I want</strong> to simulate my credit with 20-, 25-, and 30-year terms (referential timeframes), <strong>in order to</strong> find the right balance between monthly installment and credit lifetime.</p>","notes":"<ul><li>Referential simulation only — reuses the dividend/interest logic; does not replace a formal bank quote.</li><li>Related simulations: <a class=\"xref\" data-go=\"HU20\" href=\"#HU20\">HU 20</a> (UF/rates), <a class=\"xref\" data-go=\"HU25\" href=\"#HU25\">HU 25</a> (subsidies).</li></ul>","acs":[{"code":"E1","title":"Automatic adjustment of installments and interest","body":"<p><strong>Given</strong> I change the term to 20 years,</p><p><strong>When</strong> the system processes it,</p><p><strong>Then</strong> the monthly installment rises but the final interest is reduced.</p>"},{"code":"E2","title":"Notify about invalid credit simulations","body":"<p><strong>Given</strong> the projection exceeds 70 years of age,</p><p><strong>When</strong> I choose 30 years,</p><p><strong>Then</strong> the simulator notifies me that this option is not valid.</p>"},{"code":"E3","title":"Visualization of results for intermediate terms","body":"<p><strong>Given</strong> a term other than the minimum is chosen,</p><p><strong>When</strong> the system processes the result,</p><p><strong>Then</strong> it must show the results of the previous terms, perhaps as a chart, to see the variations in installment and interest by segment.</p>"}],"up":[{"id":"HU3","oneSided":false,"why":"E1 adjusts installment and interest from credit parameters the scoring engine already resolves. This story's note: <em>&quot;reuses the dividend/interest logic&quot;</em>.","tag":"documented","backward":false}],"down":[],"propUp":[],"propDown":[],"flag":null},"HU27":{"id":"HU27","kind":"story","title":"Sales Conversion-Rate Dashboard","lede":"Documented for planning. A general sales-funnel dashboard so an admin/executive can measure whether the sales cycle is shrinking toward the 6-month target.","sprint":"Sprint 3","status":"🗓 Planned","category":"Desirable","sp":5,"actor":"Real Estate Admin / Sales Executive","story":"<p><strong>As</strong> a real estate admin/sales executive, <strong>I want</strong> to visualize the general sales funnel, <strong>in order to</strong> measure whether the sales cycle is being reduced to 6 months.</p>","notes":"<ul><li>Builds on the event-log data from <a class=\"xref\" data-go=\"HU23\" href=\"#HU23\">HU 23</a> and the lead status model.</li><li>Directly measures the business goal (reducing the sales cycle) described in the project's value proposition.</li></ul>","acs":[{"code":"E1","title":"Measure improvement-plan impact","body":"<p><strong>Given</strong> I entered the managerial dashboard,</p><p><strong>When</strong> I review the funnel chart,</p><p><strong>Then</strong> I see how many leads moved from &quot;In progress / In improvement plan&quot; to &quot;Deal Closed&quot;.</p>"},{"code":"E2","title":"Measure average time from pre-assessment to conversion","body":"<p><strong>Given</strong> I want to see the tool's impact,</p><p><strong>When</strong> I review the time KPI,</p><p><strong>Then</strong> I visualize the average number of days from pre-assessment to &quot;Deal Closed&quot;.</p>"},{"code":"E3","title":"Charts over time","body":"<p><strong>Given</strong> I want to measure how sales metrics have evolved over time (week over week, month over month, year over year),</p><p><strong>When</strong> I enter the historical evaluations tab,</p><p><strong>Then</strong> different charts must be displayed according to the selected timeframe, showing how sales have changed since the app started being used.</p>"}],"up":[{"id":"HU23","oneSided":false,"why":"This story's note: <em>&quot;Builds on the event-log data from HU 23.&quot;</em> E2's average time from pre-assessment to closed deal needs timestamped events that only HU 23 records.","tag":"documented","backward":false}],"down":[],"propUp":[],"propDown":[],"flag":null},"HU28":{"id":"HU28","kind":"story","title":"Demographic & Socioeconomic Visualization","lede":"Documented for planning. Lets an executive/admin analyze the age, income, and debt of prospects to adjust the real estate company's future marketing strategies. Exports are anonymized.","sprint":"Sprint 3","status":"🗓 Planned","category":"Optional","sp":1,"actor":"Sales Executive / Real Estate Admin","story":"<p><strong>As</strong> a sales executive/real estate admin, <strong>I want</strong> to analyze the age, income, and debt of prospects, <strong>in order to</strong> adjust the real estate company's future marketing strategies.</p>","notes":"<ul><li>E3 anonymization enforces the RNF <strong>Data privacy</strong> attribute and the ethics commitment — see <span class=\"xref-ext\">Atributos de calidad</span>.</li><li>Consumes the consent-gated event data from <a class=\"xref\" data-go=\"HU23\" href=\"#HU23\">HU 23</a>.</li></ul>","acs":[{"code":"E1","title":"Report visualization ordered by filters","body":"<p><strong>Given</strong> an executive who wants to consult the report,</p><p><strong>When</strong> the prospect-log data is ordered,</p><p><strong>Then</strong> the distribution of leads must be visualized according to the indicated filter (debt, age, income, etc.).</p>"},{"code":"E2","title":"PDF report generation","body":"<p><strong>Given</strong> I want to download the report generated from the logs,</p><p><strong>When</strong> I click the &quot;Download report&quot; button,</p><p><strong>Then</strong> a PDF report with the prospect-log data must be generated and downloaded.</p>"},{"code":"E3","title":"Anonymization of data in PDF reports","body":"<p><strong>Given</strong> the data is exported,</p><p><strong>When</strong> I generate a report,</p><p><strong>Then</strong> the personal-identification fields are omitted (anonymization).</p>"}],"up":[{"id":"HU23","oneSided":false,"why":"This story's note: <em>&quot;Consumes the consent-gated event data from HU 23.&quot;</em> E1 orders &quot;the prospect-log data&quot; by the selected filter.","tag":"documented","backward":false}],"down":[],"propUp":[],"propDown":[],"flag":null},"HU29":{"id":"HU29","kind":"story","title":"Mobile Experience for the Lead","lede":"A responsive, mobile-first version of the lead flow — landing, pre-assessment form, result, and improvement plan — usable from a phone without loss of functionality.","sprint":"Sprint 1","status":"🔜 Sprint 1","category":"Essential","sp":5,"actor":"Lead","story":"<p><strong>As</strong> a lead interested in buying a home, <strong>I want</strong> to complete my financial pre-assessment and review my result from a phone, <strong>in order to</strong> know my financial situation simply, quickly, and without depending on a computer.</p>","notes":"<ul><li>This is the mobile counterpart of the lead-facing stories <a class=\"xref\" data-go=\"HU1\" href=\"#HU1\">HU 1</a>, <a class=\"xref\" data-go=\"HU3\" href=\"#HU3\">HU 3</a>, and <a class=\"xref\" data-go=\"HU7\" href=\"#HU7\">HU 7</a>; it adds no new business logic, only responsive delivery.</li><li>The executive-side mobile counterpart is <a class=\"xref\" data-go=\"HU30\" href=\"#HU30\">HU 30</a>.</li><li>Supports the RNF <strong>Ease of use</strong> attribute — see <span class=\"xref-ext\">Atributos de calidad</span>.</li></ul>","acs":[{"code":"E1","title":"Responsive pre-assessment flow","body":"<p><strong>Given</strong> the lead accesses from a mobile device,</p><p><strong>When</strong> they view the landing, the pre-assessment form, and the result screen,</p><p><strong>Then</strong> the system must adapt the elements to the screen without horizontal scrolling or loss of information.</p>"},{"code":"E2","title":"Usable mobile form","body":"<p><strong>Given</strong> the lead completes their assessment from a phone,</p><p><strong>When</strong> they enter financial data such as income, debts, savings, and employment situation,</p><p><strong>Then</strong> the fields must be legible, easy to select, and use appropriate keyboards for each data type.</p>"},{"code":"E3","title":"Readable financial result on mobile","body":"<p><strong>Given</strong> the lead finished their pre-assessment from a phone,</p><p><strong>When</strong> they view their score, classification, purchase capacity, and recommendations,</p><p><strong>Then</strong> the information must be shown in an orderly way, prioritizing the most important elements.</p>"},{"code":"E4","title":"Improvement plan accessible from mobile","body":"<p><strong>Given</strong> the lead has an active improvement plan,</p><p><strong>When</strong> they access from a mobile device,</p><p><strong>Then</strong> they must be able to review their milestones, record progress, and view their progress without losing functionality relative to the desktop version.</p>"},{"code":"E5","title":"Validation on mobile screen sizes","body":"<p><strong>Given</strong> the mobile version of the lead flow is delivered,</p><p><strong>When</strong> interface tests are run,</p><p><strong>Then</strong> its behavior must be verified on representative phone resolutions, such as 360×800, 390×844, and 430×932.</p>"}],"up":[{"id":"HU1","oneSided":false,"why":"E1 and E2 render the pre-assessment form on a phone. This story's note: <em>&quot;mobile counterpart of the lead-facing stories HU 1, HU 3, and HU 7; it adds no new business logic, only responsive delivery.&quot;</em>","tag":"documented","backward":false},{"id":"HU3","oneSided":false,"why":"E3 renders &quot;score, classification, purchase capacity, and recommendations&quot; — HU 3's result payload.","tag":"documented","backward":false},{"id":"HU7","oneSided":false,"why":"E4 requires the lead to &quot;review their milestones, record progress&quot; from mobile without losing desktop functionality; that plan is HU 7's.","tag":"documented","backward":false}],"down":[],"propUp":[],"propDown":[],"flag":null},"HU30":{"id":"HU30","kind":"story","title":"Mobile-Adaptable Executive Dashboard","lede":"A card-based, responsive version of the executive lead dashboard, so executives can review, filter, and act on leads from a phone with the same permissions as desktop.","sprint":"Sprint 1","status":"🔜 Sprint 1","category":"Essential","sp":5,"actor":"Sales Executive","story":"<p><strong>As</strong> a sales executive, <strong>I want</strong> to review and manage leads from my phone, <strong>in order to</strong> prioritize viable prospects and do commercial follow-up without depending on a computer.</p>","notes":"<ul><li>Mobile counterpart of <a class=\"xref\" data-go=\"HU2\" href=\"#HU2\">HU 2</a>; the lead-side counterpart is <a class=\"xref\" data-go=\"HU29\" href=\"#HU29\">HU 29</a>.</li><li>E4 quick actions (change status, report inconsistency) connect to <a class=\"xref\" data-go=\"HU24\" href=\"#HU24\">HU 24</a> and the lead status model.</li><li>E6 role enforcement aligns with <a class=\"xref\" data-go=\"HU5\" href=\"#HU5\">HU 5</a> and <a class=\"xref\" data-go=\"HU14\" href=\"#HU14\">HU 14</a>.</li></ul>","acs":[{"code":"E1","title":"Card-based mobile dashboard","body":"<p><strong>Given</strong> the executive accesses the dashboard from a phone,</p><p><strong>When</strong> they view the leads list,</p><p><strong>Then</strong> the system must show the information as cards adapted to a mobile screen, avoiding hard-to-read tables.</p>"},{"code":"E2","title":"Accessible mobile filters","body":"<p><strong>Given</strong> the executive reviews leads from a phone,</p><p><strong>When</strong> they need to filter by score, status, priority, project, or classification,</p><p><strong>Then</strong> the filters must be available in a collapsible or compact section without saturating the screen.</p>"},{"code":"E3","title":"Key information visible per lead","body":"<p><strong>Given</strong> the executive views a lead card,</p><p><strong>When</strong> they review the mobile dashboard,</p><p><strong>Then</strong> they must be able to see at least name, classification, score, estimated capacity, main blocker, and commercial status.</p>"},{"code":"E4","title":"Executive quick actions","body":"<p><strong>Given</strong> the executive reviews a lead from their phone,</p><p><strong>When</strong> they select a card,</p><p><strong>Then</strong> they must be able to run main actions such as view detail, change status, mark follow-up, or report inconsistency.</p>"},{"code":"E5","title":"Clear prioritization on small screens","body":"<p><strong>Given</strong> multiple leads exist in the dashboard,</p><p><strong>When</strong> the executive accesses from mobile,</p><p><strong>Then</strong> the highest-priority leads must be visually distinguishable from medium, low, or discarded leads.</p>"},{"code":"E6","title":"Role permissions maintained","body":"<p><strong>Given</strong> the mobile dashboard shows leads' financial information,</p><p><strong>When</strong> a user accesses from a phone,</p><p><strong>Then</strong> the system must maintain the same access restrictions and permissions as the desktop version.</p>"},{"code":"E7","title":"Functional testing on mobile devices","body":"<p><strong>Given</strong> the mobile version of the dashboard is delivered,</p><p><strong>When</strong> acceptance tests are run,</p><p><strong>Then</strong> it must be validated that the main actions work correctly on representative mobile resolutions.</p>"}],"up":[{"id":"HU2","oneSided":false,"why":"This story's note: <em>&quot;Mobile counterpart of HU 2.&quot;</em> E1–E3 re-render HU 2's prioritized lead list as mobile cards.","tag":"documented","backward":false},{"id":"HU5","oneSided":false,"why":"E6 requires the mobile dashboard to &quot;maintain the same access restrictions and permissions as the desktop version&quot;. This story's note: <em>&quot;E6 role enforcement aligns with HU 5 and HU 14.&quot;</em>","tag":"documented · B9","backward":false},{"id":"HU9","oneSided":false,"why":"E3 requires &quot;estimated capacity&quot; on every lead card. Same missing computation as HU 13 — the value is defined only in HU 9 E4 and does not exist in the scoring engine.","tag":"inferred · B8","backward":true},{"id":"HU14","oneSided":false,"why":"The second half of E6's role enforcement. Soft: E6 only requires parity with whatever the desktop enforces, so HU 5 alone satisfies a minimum and HU 14 raises the ceiling.","tag":"inferred · S4","backward":true},{"id":"HU24","oneSided":false,"why":"E4's quick actions include &quot;report inconsistency&quot;, which is HU 24 E3. HU 24's note: <em>&quot;Quick 'report inconsistency' action is exposed on mobile — see HU 30 E4.&quot;</em>","tag":"documented · B6","backward":true}],"down":[],"propUp":[],"propDown":[],"flag":null},"HU31":{"id":"HU31","kind":"story","title":"Simulated CMF Query","lede":"Documented for planning. Lets an executive verify delinquency/debt background from the user-provided information, producing a referential risk classification. This is an internal simulation, <strong>not</strong> an official CMF query.","sprint":"Sprint 2","status":"🗓 Planned","category":"Optional","sp":5,"actor":"Sales Executive","story":"<p><strong>As</strong> a sales executive, <strong>I want</strong> to verify delinquency (debt) background based on the information provided by the user, <strong>in order to</strong> determine whether the lead has healthy payment behavior.</p>","notes":"<ul><li>Integration requirements for a real CMF query are researched in <strong>Spike 2</strong>; this story ships the internal, referential simulation.</li><li>A scoring adjustment (E6) is a recalculation trigger for <a class=\"xref\" data-go=\"HU33\" href=\"#HU33\">HU 33</a>.</li><li>Aligns with the CLAUDE.md guardrail: no integration with external APIs (CMF, Dicom, banks) without explicit instruction — hence &quot;simulated&quot;.</li></ul>","acs":[{"code":"E1","title":"Generation of debt-background simulation","body":"<p><strong>Given</strong> the lead completed their financial pre-assessment,</p><p><strong>When</strong> the executive requests to review their simulated debt background,</p><p><strong>Then</strong> the system must generate a referential result considering income, declared debts, financial burden, reported delinquency, and declared payment behavior.</p>"},{"code":"E2","title":"Debt-risk classification","body":"<p><strong>Given</strong> the system processed the lead's declared financial information,</p><p><strong>When</strong> the simulation is generated,</p><p><strong>Then</strong> it must classify the debt risk into levels such as &quot;Low&quot;, &quot;Medium&quot;, &quot;High&quot;, or &quot;Critical&quot;, according to previously defined internal rules.</p>"},{"code":"E3","title":"Explanation of the obtained result","body":"<p><strong>Given</strong> a generated debt simulation exists,</p><p><strong>When</strong> the executive reviews the lead's detail,</p><p><strong>Then</strong> the system must show a clear explanation of the factors that influenced the result, indicating whether financial burden, declared delinquency, or current debts negatively affected the evaluation.</p>"},{"code":"E4","title":"System cache","body":"<p><strong>Given</strong> a previous simulation associated with the lead exists,</p><p><strong>When</strong> the executive requests to consult their simulated background again,</p><p><strong>Then</strong> the system must reuse the saved result if the financial data has not changed.</p>"},{"code":"E5","title":"CMF query only for validated leads","body":"<p><strong>Given</strong> the lead does not have sufficient or valid financial information,</p><p><strong>When</strong> the simulation is attempted,</p><p><strong>Then</strong> the system must block the query and request completing the required data.</p>"},{"code":"E6","title":"Scoring adjustment based on the simulated result","body":"<p><strong>Given</strong> the simulation detects a relevant risk level,</p><p><strong>When</strong> the system updates the lead's evaluation,</p><p><strong>Then</strong> it must apply an adjustment to the financial scoring and record the reason for the change, making clear that it corresponds to an internal simulation and not an official CMF query.</p>"}],"up":[{"id":"HU3","oneSided":false,"why":"E1 builds the simulation from &quot;income, declared debts, financial burden, reported delinquency&quot;, and E6 adjusts the financial scoring itself.","tag":"documented","backward":false},{"id":"HU33","oneSided":false,"why":"This story's note: <em>&quot;A scoring adjustment (E6) is a recalculation trigger for HU 33.&quot;</em>","tag":"documented · B3","backward":false}],"down":[],"propUp":[],"propDown":[],"flag":null},"HU32":{"id":"HU32","kind":"story","title":"System Availability & Scalability","lede":"Documented for planning. Monitors system availability and validates behavior under load, to guarantee ≥ 95% uptime and support ≥ 100 evaluations without data loss during the test period.","sprint":"Sprint 3","status":"🗓 Planned","category":"Desirable","sp":5,"actor":"Dev / DevOps","story":"<p><strong>As</strong> the development/DevOps team, <strong>I want</strong> to monitor system availability and validate its behavior under load, <strong>in order to</strong> guarantee ≥ 95% uptime and support ≥ 100 evaluations without data loss during the test period.</p>","notes":"<ul><li>Directly operationalizes the RNF <strong>Uptime</strong>, <strong>Scalability</strong>, and <strong>Response time</strong> attributes — see <span class=\"xref-ext\">Atributos de calidad</span>.</li><li>Mitigates the risk <strong>&quot;Dependency on external services&quot;</strong> — see <span class=\"xref-ext\">Riesgos técnicos</span>.</li></ul>","acs":[{"code":"E1","title":"Uptime monitoring","body":"<p><strong>Given</strong> the system is deployed in staging/production,</p><p><strong>When</strong> the test period elapses,</p><p><strong>Then</strong> a monitoring mechanism must record availability evidencing ≥ 95% uptime, with alerting on outages.</p>"},{"code":"E2","title":"Post-deploy smoke tests","body":"<p><strong>Given</strong> a deploy is executed,</p><p><strong>When</strong> the pipeline finishes,</p><p><strong>Then</strong> smoke tests must run that verify critical endpoints (including <code>POST /score</code>) respond correctly.</p>"},{"code":"E3","title":"Load test","body":"<p><strong>Given</strong> ≥ 100 evaluations are simulated,</p><p><strong>When</strong> the load test is run against Supabase,</p><p><strong>Then</strong> the system must process them without data loss or degradation that prevents showing the score within the defined limit.</p>"}],"up":[],"down":[],"propUp":[],"propDown":[],"flag":null},"HU33":{"id":"HU33","kind":"story","title":"Immutable, Versioned Evaluation History","lede":"Documented for planning. Ensures every recalculation or scoring adjustment creates a new versioned, immutable evaluation linked to the previous one, preserving a faithful and traceable history that cannot be altered.","sprint":"Sprint 2","status":"🗓 Planned","category":"Desirable","sp":5,"actor":"Real Estate Admin","story":"<p><strong>As</strong> a real estate admin, <strong>I want</strong> every recalculation or scoring adjustment to generate a new versioned and immutable evaluation linked to the previous one, <strong>in order to</strong> preserve a faithful and traceable history that cannot be altered.</p>","notes":"<ul><li>Extends the immutable-record requirement of <a class=\"xref\" data-go=\"HU3\" href=\"#HU3\">HU 3</a> E5 into a full version chain.</li><li>Maps to the <code>evaluations</code> table with a self-referencing lineage link — see <span class=\"xref-ext\">evaluations</span>.</li><li>Supports the RNF <strong>Traceability</strong> attribute and pairs with the auditing story <a class=\"xref\" data-go=\"HU16\" href=\"#HU16\">HU 16</a>.</li><li><strong>Cross-reference note:</strong> the E4 source referenced &quot;HU41&quot; and &quot;HU15&quot; in this story's E1; these are corrected here to HU 31 (CMF) and HU 16 (audit) respectively — the actual matching stories.</li></ul>","acs":[{"code":"E1","title":"New version per recalculation","body":"<p><strong>Given</strong> a recalculation or score adjustment occurs (debt payment <a class=\"xref\" data-go=\"HU8\" href=\"#HU8\">HU 8</a>, configuration change <a class=\"xref\" data-go=\"HU14\" href=\"#HU14\">HU 14</a>/<a class=\"xref\" data-go=\"HU15\" href=\"#HU15\">HU 15</a>, CMF adjustment <a class=\"xref\" data-go=\"HU31\" href=\"#HU31\">HU 31</a>, subsidy simulation <a class=\"xref\" data-go=\"HU25\" href=\"#HU25\">HU 25</a>),</p><p><strong>When</strong> the system updates the evaluation,</p><p><strong>Then</strong> it must create a new versioned evaluation record instead of modifying the existing one.</p>"},{"code":"E2","title":"Immutability and lineage","body":"<p><strong>Given</strong> a previous evaluation exists,</p><p><strong>When</strong> its successor is generated,</p><p><strong>Then</strong> the previous record must remain immutable (no UPDATE or DELETE) and be linked to the new version.</p>"},{"code":"E3","title":"Record traceability","body":"<p><strong>Given</strong> an evaluation is persisted,</p><p><strong>When</strong> it is saved,</p><p><strong>Then</strong> it must include timestamp, <code>scoring_version</code>, snapshot of the input data, and the reason for the recalculation.</p>"},{"code":"E4","title":"Consistency with auditing","body":"<p><strong>Given</strong> an executive/admin consults the history via <a class=\"xref\" data-go=\"HU16\" href=\"#HU16\">HU 16</a>,</p><p><strong>When</strong> they review an evaluation,</p><p><strong>Then</strong> they must be able to reconstruct the chain of versions in chronological order with its reason.</p>"}],"up":[{"id":"HU3","oneSided":false,"why":"This story's note: <em>&quot;Extends the immutable-record requirement of HU 3 E5 into a full version chain.&quot;</em>","tag":"documented","backward":false},{"id":"HU16","oneSided":false,"why":"E4 requires an admin to reconstruct the version chain &quot;via HU 16&quot;. Previously declared only by HU 16's <code>Required by</code>; confirmed from this side 2026-08-08.","tag":"documented · B11","backward":false}],"down":[{"id":"HU8","oneSided":false},{"id":"HU15","oneSided":false},{"id":"HU18","oneSided":false},{"id":"HU25","oneSided":false},{"id":"HU31","oneSided":false}],"propUp":[],"propDown":[],"flag":null}};

function reach(id, map) {
  var seen = {}, stack = [id];
  while (stack.length) {
    var n = stack.pop();
    (map[n] || []).forEach(function (m) { if (!seen[m]) { seen[m] = 1; stack.push(m); } });
  }
  return seen;
}

function badge(text, cls) {
  return text ? '<span class="badge ' + (cls || '') + '">' + text + '</span>' : '';
}

function why(list) {
  if (!list.length) return '<div class="none">No upstream dependencies.</div>';
  return list.map(function (d) {
    var tag = d.tag ? '<span class="wtag ' + (/inferred/.test(d.tag) ? 'inf' : 'doc') + '">' + d.tag + '</span>' : '';
    var back = d.backward ? '<span class="wtag back">crosses sprints backward</span>' : '';
    return '<div class="why"><div class="wh"><button class="chip" data-go="' + d.id + '">' +
      d.id.replace(/HU(\d+)/, 'HU $1') + '</button>' + tag + back + '</div>' +
      (d.why ? '<div class="wb">' + d.why + '</div>' : '<div class="wb none">No rationale recorded.</div>') + '</div>';
  }).join('');
}

function chips(list) {
  if (!list.length) return '<div class="none">none</div>';
  return '<div class="chips">' + list.map(function (d) {
    return '<button class="chip' + (d.oneSided ? ' unconfirmed' : '') + '" data-go="' + d.id + '">' +
      d.id.replace(/HU(\d+)/, 'HU $1') + '</button>';
  }).join('') + '</div>';
}

function render(id) {
  var d = DATA[id];
  var stKey = d.kind === 'spike' ? 'st-spike' : (/✅/.test(d.status) ? 'st-done' : (/🔜/.test(d.status) ? 'st-next' : ''));
  var h = '<h2>' + d.id.replace(/HU(\d+)/, 'HU $1').replace(/Spike(\d+)/, 'Spike $1') + ' — ' + d.title + '</h2>';
  if (d.lede) h += '<p class="lede">' + d.lede + '</p>';
  h += '<div class="badges">' + badge(d.sprint) + badge(d.status, stKey) + badge(d.category) +
       badge(d.sp + ' SP') + badge(d.actor) + '</div>';
  if (d.story) h += '<h3>User story</h3><blockquote class="story">' + d.story + '</blockquote>';
  h += '<h3>Depends on (' + d.up.length + ')</h3>' + why(d.up);
  h += '<h3>Required by (' + d.down.length + ')</h3>' + chips(d.down);
  if (d.flag) {
    var f = d.flag;
    var cls = f.mark || 'plain';
    var head = f.mark === 'ahead' ? 'Implementation found — status says planned'
      : f.mark === 'behind' ? 'No implementation found' : 'Implementation evidence';
    h += '<h3>Implementation</h3><div class="flagbox ' + cls + '"><b>' + head + '</b>';
    if (f.covered && f.covered.length) h += 'Appears covered: ' + f.covered.join(', ') + '<br>';
    if (f.not_located && f.not_located.length) h += 'Not located: ' + f.not_located.join(', ') + '<br>';
    if (f.note) h += f.note + '<br>';
    if (f.evidence && f.evidence.length)
      h += f.evidence.map(function (x) { return '<code>' + x + '</code>'; }).join(' ');
    h += '</div>';
  }
  var props = (d.propUp || []).concat(d.propDown || []);
  if (props.length) {
    h += '<h3>Proposed (' + props.length + ')</h3>';
    h += props.map(function (p) {
      var other = p.dir === 'up' ? p.from : p.to;
      var arrow = p.dir === 'up' ? '← depends on ' : '→ required by ';
      return '<div class="prop-item"><div class="ph">' + p.id + ' ' + arrow +
        '<button class="chip" data-go="' + other + '">' + other.replace(/HU(\d+)/, 'HU $1') + '</button>' +
        '<span class="tag">' + p.type + ' · ' + p.basis + (p.backward ? ' · backward' : '') + '</span></div>' +
        '<div class="pb">' + p.evidence + '</div></div>';
    }).join('');
  }
  if (d.acs.length) {
    h += '<h3>Acceptance criteria (' + d.acs.length + ')</h3>';
    h += d.acs.map(function (a) {
      return '<div class="ac"><div class="code">' + a.code + '</div><div class="actitle">' + a.title + '</div>' + a.body + '</div>';
    }).join('');
  } else if (d.kind === 'spike') {
    h += '<h3>Acceptance criteria</h3><div class="none">Research spike — no acceptance criteria defined.</div>';
  }
  if (d.notes) h += '<h3>Notes</h3><details class="notes"><summary>Show notes</summary>' + d.notes + '</details>';
  panel.innerHTML = h;
  panel.scrollTop = 0;
  document.querySelector('aside').scrollTop = 0;
}

function select(id) {
  if (!DATA[id]) return;
  current = id;
  var anc = reach(id, up), desc = reach(id, down);
  var lit = {}; lit[id] = 1;
  Object.keys(anc).forEach(function (k) { lit[k] = 1; });
  Object.keys(desc).forEach(function (k) { lit[k] = 1; });

  svg.classList.add('sel');
  svg.querySelectorAll('.node').forEach(function (n) {
    var nid = n.getAttribute('data-id');
    n.classList.toggle('rel', !!lit[nid]);
    n.classList.toggle('cur', nid === id);
  });
  svg.querySelectorAll('.edge').forEach(function (e) {
    e.classList.toggle('rel', !!lit[e.getAttribute('data-from')] && !!lit[e.getAttribute('data-to')]);
  });
  // Las propuestas no entran en el alcance transitivo: sólo se encienden las que
  // tocan directamente el nodo elegido, para no mezclar propuesta con declarado.
  svg.querySelectorAll('.prop').forEach(function (e) {
    var a = e.getAttribute('data-from'), b = e.getAttribute('data-to');
    var touches = a === id || b === id;
    e.classList.toggle('rel', touches);
    if (touches) { lit[a] = 1; lit[b] = 1; }
  });
  svg.querySelectorAll('.node').forEach(function (n) {
    if (lit[n.getAttribute('data-id')]) n.classList.add('rel');
  });

  render(id);
  body.classList.add('open');
  if (history.replaceState) history.replaceState(null, '', '#' + id);
}

function clear() {
  current = null;
  svg.classList.remove('sel');
  svg.querySelectorAll('.rel,.cur').forEach(function (e) { e.classList.remove('rel', 'cur'); });
  body.classList.remove('open');
  if (history.replaceState) history.replaceState(null, '', location.pathname + location.search);
}

svg.addEventListener('click', function (ev) {
  var g = ev.target.closest('.node');
  if (g) select(g.getAttribute('data-id')); else clear();
});
svg.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  var g = ev.target.closest('.node');
  if (g) { ev.preventDefault(); select(g.getAttribute('data-id')); }
});
document.addEventListener('click', function (ev) {
  var go = ev.target.closest('[data-go]');
  if (go) { ev.preventDefault(); select(go.getAttribute('data-go')); }
});
document.querySelector('.close').addEventListener('click', clear);
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') clear(); });

var z100 = document.getElementById('z100'), zfit = document.getElementById('zfit');
function setZoom(fit) {
  body.classList.toggle('fit', fit);
  z100.setAttribute('aria-pressed', String(!fit));
  zfit.setAttribute('aria-pressed', String(fit));
}
z100.addEventListener('click', function () { setZoom(false); });
zfit.addEventListener('click', function () { setZoom(true); });

var zprop = document.getElementById('zprop');
if (zprop) zprop.addEventListener('click', function () {
  var on = !body.classList.contains('props');
  body.classList.toggle('props', on);
  zprop.setAttribute('aria-pressed', String(on));
  if (current) select(current);
});

var hash = (location.hash || '').replace('#', '');
if (DATA[hash]) select(hash);
</script>
</body>
</html>
