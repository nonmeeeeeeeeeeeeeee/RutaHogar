:root{
  --bg:#f7f8fa; --ink:#1c2530; --muted:#6b7785; --line:#d6dbe2; --panel:#fff;
  --done-bg:#e6f4ea; --done-br:#2e7d32; --next-bg:#e4f0fb; --next-br:#1565c0;
  --plan-bg:#f2f4f7; --plan-br:#98a2b0; --spike-bg:#f4ecfa; --spike-br:#7b3fa0;

*{box-sizing:border-box}
html,body{margin:0;height:100%}
/* Flujo normal en columna: el header envuelve a anchos chicos y su alto varía,
   así que reservarle una altura fija dejaba el grafo por debajo del encabezado. */
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column}
header.top{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
header.top h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
.counts{color:var(--muted);font-size:12.5px}
.counts b{color:var(--amber);font-weight:650}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-left:auto;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1.5px solid;margin-right:5px;vertical-align:-1px}
.legend .l-done i{background:var(--done-bg);border-color:var(--done-br)}
.legend .l-next i{background:var(--next-bg);border-color:var(--next-br)}
.legend .l-plan i{background:var(--plan-bg);border-color:var(--plan-br)}
.legend .l-spike i{background:var(--spike-bg);border-color:var(--spike-br);border-radius:0}
.legend svg{vertical-align:-2px}

#canvas{flex:1 1 auto;min-height:0;overflow:auto;transition:padding-right .18s ease}
body.open #canvas{padding-right:428px}
svg.graph{display:block;margin:14px auto 40px}
/* Fit: el viewBox hace el escalado, así que basta soltar el ancho fijo. */
body.fit svg.graph{width:100%;height:auto;max-width:100%;margin:14px 0 20px}
body.fit #canvas{overflow-x:hidden}
.zoom{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.zoom button{border:none;background:var(--panel);color:var(--muted);font:inherit;font-size:11.5px;font-weight:650;
  padding:3px 11px;cursor:pointer}
.zoom button+button{border-left:1px solid var(--line)}
.zoom button[aria-pressed="true"]{background:var(--next-bg);color:var(--next-br)}
#zprop[aria-pressed="true"]{background:#efe7ff;color:var(--prop)}
.prop-key .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.prop-key .dot.ahead{background:var(--ahead)}
.prop-key .dot.behind{background:var(--behind)}
.why{border:1px solid var(--line);border-left:3px solid var(--next-br);border-radius:0 6px 6px 0;padding:8px 10px;margin-bottom:7px;background:#fcfdfe}
.why .wh{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.why .wb{font-size:12px;color:#43505d;margin-top:5px;line-height:1.5}
.why .wb.none{font-style:italic;color:var(--muted)}
.wtag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:3px}
.wtag.doc{background:#e6f4ea;color:#1d5c26}
.wtag.inf{background:#fff3e0;color:#8a5200}
.wtag.back{background:#fdeaea;color:#a02020}
.prop-item{border-left:3px solid var(--prop);background:#faf7ff;padding:8px 10px;border-radius:0 6px 6px 0;margin-bottom:7px}
.prop-item .ph{font-size:12px;font-weight:700;color:var(--prop)}
.prop-item .pb{font-size:11.5px;color:#4a5561;margin-top:3px}
.prop-item .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#7a869a;margin-left:6px}
.flagbox{border-radius:7px;padding:9px 11px;margin-bottom:8px;font-size:12.5px}
.flagbox.ahead{background:#e4f4f2;border-left:3px solid var(--ahead)}
.flagbox.behind{background:#fdeaea;border-left:3px solid var(--behind)}
.flagbox.plain{background:#f2f4f7;border-left:3px solid var(--muted)}
.flagbox b{display:block;margin-bottom:4px}
.flagbox code{font-size:11px;background:#fff;display:inline-block;margin:1px 2px 1px 0}

.band{fill:#fff;stroke:var(--line);stroke-width:1}
.lane-name{font-size:13.5px;font-weight:650;fill:var(--ink)}
.lane-meta{font-size:11.5px;fill:var(--muted)}

.edge{fill:none;stroke:var(--edge);stroke-width:1.5;transition:stroke .12s,stroke-width .12s,opacity .12s}
.edge.one-sided{stroke-dasharray:5 4}
.edge.backward{stroke:var(--amber);stroke-width:1.9;opacity:.85}
.node .box{fill:var(--plan-bg);stroke:var(--plan-br);stroke-width:1.5;transition:filter .12s}
.node.done .box{fill:var(--done-bg);stroke:var(--done-br)}
.node.next .box{fill:var(--next-bg);stroke:var(--next-br)}
.node.spike .box{fill:var(--spike-bg);stroke:var(--spike-br);stroke-dasharray:4 3}
.node{cursor:pointer;outline:none}
.node .nid{font-size:12px;font-weight:700;fill:var(--ink)}
.node .sp{font-size:10.5px;fill:var(--muted);font-weight:600}
.node .ntitle{font-size:11px;fill:#48535f}
.node.spike .ntitle{font-style:italic}
.node:hover .box,.node:focus-visible .box{filter:brightness(.97)}

/* Capa de propuestas: apagada por defecto, para que el grafo abra mostrando
   sólo lo que el equipo declaró. */
.prop{fill:none;stroke:var(--prop);stroke-width:1.8;opacity:0;pointer-events:none;transition:opacity .15s}
.prop.enhances{stroke-width:1.4;stroke-dasharray:2 5;opacity:0}
.prop.blocks{stroke-dasharray:9 4}
.prop.confirms{stroke-dasharray:none}
body.props .prop{opacity:.85;pointer-events:auto}
body.props .prop.enhances{opacity:.55}
.flag circle{stroke:#fff;stroke-width:1.5}
.flag text{font-size:8px;font-weight:800;fill:#fff}
.flag.ahead circle{fill:var(--ahead)}
.flag.behind circle{fill:var(--behind)}
svg.graph.sel .prop{opacity:0}
body.props svg.graph.sel .prop.rel{opacity:.9}

svg.graph.sel .node{opacity:.22}
svg.graph.sel .edge{opacity:.09}
svg.graph.sel .node.rel{opacity:1}
svg.graph.sel .edge.rel{opacity:1;stroke:var(--edge-hot);stroke-width:2.1}
svg.graph.sel .edge.rel.backward{stroke:var(--amber)}
svg.graph.sel .node.cur .box{stroke-width:3}

aside{position:fixed;top:0;right:0;width:428px;height:100%;background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .18s ease;overflow:auto;padding:20px 22px 60px}
body.open aside{transform:none}
aside h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
aside .lede{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}

.badge.st-next{background:var(--next-bg);color:#0f4c8f}
.badge.st-spike{background:var(--spike-bg);color:#5c2b7a}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:20px 0 8px;font-weight:700}
blockquote.story{margin:0;padding:11px 13px;background:#f4f6f9;border-left:3px solid var(--next-br);border-radius:0 6px 6px 0;font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:5px;border:1px solid var(--line);background:#fbfcfd;cursor:pointer;font-weight:600;color:#38434f}
.chip:hover{border-color:var(--next-br);color:var(--next-br)}
.chip.unconfirmed{border-style:dashed}
.chip.unconfirmed::after{content:" ?";color:var(--amber)}
.none{color:var(--muted);font-size:12.5px;font-style:italic}
.ac{border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin-bottom:8px;background:#fcfdfe}
.ac .code{font-size:11px;font-weight:700;color:var(--next-br);letter-spacing:.03em}
.ac .actitle{font-size:12.5px;font-weight:650;margin:1px 0 6px}
.ac p{margin:0 0 3px;font-size:12.5px;color:#3c4652}
.ac strong{color:var(--ink)}
details.notes{margin-top:6px}
details.notes summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:600}
details.notes ul{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:#3c4652}
details.notes li{margin-bottom:5px}
code{background:#eef1f5;padding:1px 4px;border-radius:3px;font-size:11.5px}
.xref{color:var(--next-br);text-decoration:none;font-weight:600}
.xref:hover{text-decoration:underline}
.xref-ext{color:var(--muted)}
.close{position:absolute;top:14px;right:16px;border:none;background:none;font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
.close:hover{color:var(--ink)}
footer.stamp{flex:0 0 auto;padding:6px 22px;font-size:10.5px;color:#9aa4b0;background:var(--panel);border-top:1px solid var(--line)}
@media print{aside,.close{display:none}body{display:block;height:auto}#canvas{padding:0;overflow:visible}}

var DATA = {"Spike1":{"id":"Spike1","kind":"spike","title":"Financial research: scoring, financial education, commercial prioritization criteria","lede":"","sprint":"Sprint 1","status":"Spike de investigación","category":"Spike","sp":10,"actor":"—","story":"","notes":"","acs":[],"up":[],"down":[],"propUp":[],"propDown":[],"flag":null},"Spike2":{"id":"Spike2","kind":"spike","title":"Technical validation: privacy, roles, traceability, documents, external integrations","lede":"","sprint":"Sprint 2","status":"Spike de investigación","category":"Spike","sp":20,"actor":"—","story":"","notes":"","acs":[],"up":[],"down":[],"propUp":[],"propDown":[],"flag":null},"HU1":{"id":"HU1","kind":"story","title":"Financial Data Entry","lede":"Covers the initial data capture step: a guided, multi-step web form that collects the lead's core financial and employment information, validates it in real time, and routes the user to the scoring result — all without requiring documents or contact with a sales executive.","sprint":"PMV (completed)","status":"✅ Implemented (PMV)","category":"Complex","sp":5,"actor":"Lead","story":"<p><strong>As</strong> a lead (person interested in buying a home), <strong>I want</strong> to complete a guided web form with my financial data and high ease of use, <strong>in order to</strong> start my credit viability assessment without having to talk to a sales executive.</p>","notes":"<ul><li>The form is deliberately lightweight — no document upload in this stage. Document upload is a separate, deferred story (<a class=\"xref\" data-go=\"HU19\" href=\"#HU19\">HU 19</a>).</li><li>Rent supplement (<code>complemento_renta</code>) activates additional required fields: <code>complemento_nombre</code>, <code>complemento_monto</code>, <code>complemento_relacion</code>.</li><li>Consent validation (E3) is enforced at the middleware level in the backend, not only in the UI. See <code>POST /score</code> contract in <span class=\"xref-ext\">CLAUDE.md</span>.</li><li>A mobile-optimized version of this flow is tracked as <a class=\"xref\" data-go=\"HU29\" href=\"#HU29\">HU 29</a>.</li><li><strong>Numbering note:</strong> in the E2 informe this story was documented as <code>HdU 1</code>; the wiki now follows the E4 plan's <code>HU</code> numbering.</li></ul>","acs":[{"code":"E1","title":"Successful form completion","body":"<p><strong>Given</strong> the user accesses the ScoreLeads platform for the first time,</p><p><strong>When</strong> they complete all required fields (income, debts, contract type, age) and accept the data consent,</p><p><strong>Then</strong> the system registers their profile and automatically redirects them to their assessment result.</p>"},{"code":"E2","title":"Inconsistency in declared data","body":"<p><strong>Given</strong> the user is filling out the form,</p><p><strong>When</strong> they declare a monthly debt amount greater than their declared income,</p><p><strong>Then</strong> the system displays a visual warning on the corresponding field before allowing them to continue to the next step.</p>"},{"code":"E3","title":"Data consent","body":"<p><strong>Given</strong> a pre-qualification request is received where the data-processing consent has not been accepted,</p><p><strong>When</strong> the system validates the requirements of the request,</p><p><strong>Then</strong> the assessment and the data must not be stored, in order to protect the privacy of the information.</p>"},{"code":"E4","title":"Rent supplement","body":"<p><strong>Given</strong> the lead's credit viability assessment is configured under joint evaluation mode (supplemented income),</p><p><strong>When</strong> the system structures the pre-qualification request,</p><p><strong>Then</strong> it must instantiate an associated data requirement, mandatorily requesting the co-debtor's income and debts in order to execute the consolidated scoring calculation.</p>"}],"up":[{"id":"HU5","oneSided":false,"why":"Declared by HU 5's <code>Required by</code> (&quot;data-handling paths&quot;). HU 1 E1 registers a profile and E3 rejects unconsented submissions — those are the input-validation and controlled-error surfaces HU 5 E1–E2 define.","tag":"inferred","backward":true}],"down":[{"id":"HU3","oneSided":false},{"id":"HU6","oneSided":false},{"id":"HU23","oneSided":false},{"id":"HU29","oneSided":false}],"propUp":[],"propDown":[],"flag":null},"HU2":{"id":"HU2","kind":"story","title":"Lead Prioritization","lede":"Provides the sales executive with a prioritized, AI-assisted view of pre-qualified leads. Instead of working through a raw list of contacts, the executive sees who to call first, why, and what action to take — without needing a CRM integration at this stage.","sprint":"PMV (completed)","status":"✅ Implemented (PMV)","category":"Complex","sp":5,"actor":"Sales Executive","story":"<p><strong>As</strong> a real estate sales executive, <strong>I want</strong> to view a portfolio of pre-qualified and prioritized leads with AI support, <strong>in order to</strong> focus my time on prospects with the highest probability of advancing in the purchase process and quickly understand the financial context of each lead.</p>","notes":"<ul><li>This story deliberately avoids CRM integration (that is <a class=\"xref\" data-go=\"HU4\" href=\"#HU4\">HU 4</a>). The dashboard is self-contained.</li><li>The AI-assisted summary in E2 is generated by the same explanation layer as <a class=\"xref\" data-go=\"HU3\" href=\"#HU3\">HU 3</a> — no separate model needed.</li><li>The executive role is enforced at the routing level: only users with role <code>sales</code> can access the leads dashboard. See <code>DashboardLeads.jsx</code>.</li><li>A mobile-optimized version of this dashboard is tracked as <a class=\"xref\" data-go=\"HU30\" href=\"#HU30\">HU 30</a>.</li><li><strong>Numbering note:</strong> documented as <code>HdU 2</code> in the E2 informe; renumbered to <code>HU 2</code> following the E4 plan.</li></ul>","acs":[{"code":"E1","title":"Prioritization of high-score leads","body":"<p><strong>Given</strong> the system has processed the financial scoring of multiple prospects,</p><p><strong>When</strong> the sales executive accesses the main panel,</p><p><strong>Then</strong> leads with an &quot;Alto&quot; (High) classification must automatically appear at the top of the list.</p>"},{"code":"E2","title":"Visual indicators and intelligent explanation","body":"<p><strong>Given</strong> a lead has an assigned score,</p><p><strong>When</strong> the executive selects a specific lead,</p><p><strong>Then</strong> the system must show a visual summary of the indicators (financial burden, stability, etc.) and the intelligent explanation generated to justify that score.</p>"},{"code":"E3","title":"Filter by priority level","body":"<p><strong>Given</strong> the executive needs to organize their day,</p><p><strong>When</strong> they use the filter tool,</p><p><strong>Then</strong> the system must allow segmenting the view by Alto, Medio, or Bajo categories immediately.</p>"},{"code":"E4","title":"Suggested commercial action","body":"<p><strong>Given</strong> the executive reviews the profile of a prioritized lead,</p><p><strong>When</strong> they view the scoring detail,</p><p><strong>Then</strong> the system must display a suggested-action label (e.g. &quot;Contact immediately&quot;, &quot;Keep in follow-up&quot;, or &quot;Request more information&quot;) based on the lead's level of readiness.</p>"}],"up":[{"id":"HU3","oneSided":false,"why":"E1 sorts leads by the &quot;Alto&quot; classification and E2 renders the intelligent explanation; both are HU 3 outputs (E2 classification, E3 explanation). This story's own note: <em>&quot;The AI-assisted summary in E2 is generated by the same explanation layer as HU 3.&quot;</em>","tag":"documented","backward":false}],"down":[{"id":"HU7","oneSided":false},{"id":"HU13","oneSided":false},{"id":"HU18","oneSided":false},{"id":"HU19","oneSided":false},{"id":"HU24","oneSided":false},{"id":"HU30","oneSided":false}],"propUp":[],"propDown":[],"flag":null},"HU3":{"id":"HU3","kind":"story","title":"Hybrid Scoring with Intelligent Explanation","lede":"The core engine of ScoreLeads. Processes the financial data submitted in HU 1, computes a 0–100 score using parametric rules, classifies the lead, and generates an AI-assisted explanation of the key factors behind the result. Every evaluation is stored as an immutable record.","sprint":"PMV (completed)","status":"✅ Implemented (PMV)","category":"Very complex","sp":8,"actor":"Lead","story":"<p><strong>As</strong> a person interested in buying a home, <strong>I want</strong> to receive an immediate financial assessment through a hybrid scoring with intelligent explanation, <strong>in order to</strong> understand my level of readiness, the main factors influencing my result, and the recommended next steps before starting a formal assessment.</p>","notes":"<ul><li>The scoring engine is implemented in <code>backend/app/scoring.py</code>. Base score is 50; adjustments range from −30 to +25. Final score is clamped to [0, 100].</li><li>The AI explanation layer (<code>generate_ai_explanation</code>) is currently a deterministic mock. The real LLM provider is not yet defined — the interface is isolated so the provider can be swapped without changing the function signature.</li><li>Classification thresholds: Alto ≥ 70, Medio ≥ 40, Bajo &lt; 40.</li><li>The immutable record described in E5 maps to the <code>evaluations</code> table. See <span class=\"xref-ext\">evaluations</span> for the full schema, including <code>algoritmo_version</code> and <code>component_breakdown</code> columns. Full versioning/lineage is expanded in <a class=\"xref\" data-go=\"HU33\" href=\"#HU33\">HU 33</a>.</li><li>The E6 education flow redirect is documented in <span class=\"xref-ext\">e6-score-redirect</span>.</li><li><strong>Numbering note:</strong> documented as <code>HdU 3</code> in the E2 informe; renumbered to <code>HU 3</code> following the E4 plan.</li></ul>","acs":[{"code":"E1","title":"Display of assessment result","body":"<p><strong>Given</strong> the user has completed the form,</p><p><strong>When</strong> they submit their data for processing,</p><p><strong>Then</strong> the system must display the scoring result within a maximum of 60 seconds after the form is submitted.</p>"},{"code":"E2","title":"Lead classification by score","body":"<p><strong>Given</strong> the ScoreLeads system has received the user's data,</p><p><strong>When</strong> the scoring is performed,</p><p><strong>Then</strong> the result must classify the user into clear priority levels (Alto, Medio, Bajo).</p>"},{"code":"E3","title":"AI-powered explanation","body":"<p><strong>Given</strong> the system presents the assessment result,</p><p><strong>When</strong> the user views their credit classification,</p><p><strong>Then</strong> the system, through an AI agent, must display a detailed explanation of the main factors that influenced the score.</p>"},{"code":"E4","title":"System scope warning","body":"<p><strong>Given</strong> the user views their result,</p><p><strong>When</strong> the scoring explanation is displayed,</p><p><strong>Then</strong> the system must indicate explicitly that the score is indicative only and does not replace a formal bank assessment.</p>"},{"code":"E5","title":"Result traceability","body":"<p><strong>Given</strong> the scoring calculation is successful,</p><p><strong>When</strong> the system saves the evaluation,</p><p><strong>Then</strong> it must generate an immutable record containing the timestamp, numeric score, classification, input snapshot, algorithm version, and per-component breakdown.</p>"},{"code":"E6","title":"Education flow / sales executive notification","body":"<p><strong>Given</strong> a lead submits their financial data,</p><p><strong>When</strong> the system evaluates them and determines they do not meet the minimum qualifying score,</p><p><strong>Then</strong> they must be able to enter a financial education flow without executive intervention; and conversely, if the score is High, the sales executive must be notified.</p>"}],"up":[{"id":"HU1","oneSided":false,"why":"E1 processes the financial data submitted through HU 1's form; without it there is no input snapshot for E5's immutable record.","tag":"documented","backward":false},{"id":"HU5","oneSided":false,"why":"Declared by HU 5's <code>Required by</code>. HU 3 E5 persists a snapshot of the lead's financial data — exactly the storage path HU 5 E3 requires parameterized queries for.","tag":"inferred","backward":true}],"down":[{"id":"HU2","oneSided":false},{"id":"HU4","oneSided":false},{"id":"HU7","oneSided":false},{"id":"HU9","oneSided":false},{"id":"HU10","oneSided":false},{"id":"HU12","oneSided":false},{"id":"HU13","oneSided":false},{"id":"HU15","oneSided":false},{"id":"HU16","oneSided":false},{"id":"HU18","oneSided":false},{"id":"HU20","oneSided":false},{"id":"HU22","oneSided":false},{"id":"HU23","oneSided":false},{"id":"HU25","oneSided":false},{"id":"HU26","oneSided":false},{"id":"HU29","oneSided":false},{"id":"HU31","oneSided":false},{"id":"HU33","oneSided":false}],"propUp":[],"propDown":[],"flag":null},"HU4":{"id":"HU4","kind":"story","title":"Commercial Derivation and Integration System","lede":"Documented for planning. Do not implement without explicit team instruction. Allows qualified leads to be pushed from ScoreLeads directly into the real estate company's CRM, giving the sales team a prioritized pipeline with no manual data entry.","sprint":"Sprint 2","status":"🗓 Planned","category":"Desirable","sp":8,"actor":"Real Estate Staff","story":"<p><strong>As</strong> a real estate employee, <strong>I want</strong> to add qualified users from the application into the real estate CRM, <strong>in order to</strong> give them prioritized management within the sales flow of the real estate project.</p>","notes":"<ul><li>This story requires knowledge of the target CRM's API (endpoint, authentication, field mapping). That information is not yet available and is part of <strong>Spike 2</strong>'s scope.</li><li>The internal lead dashboard (<a class=\"xref\" data-go=\"HU2\" href=\"#HU2\">HU 2</a>) covers the prioritization need for the PMV without this integration.</li><li>When implemented, the sync logic should be event-driven (a score update triggers a CRM write) rather than a manual export.</li><li><strong>Numbering note:</strong> documented as <code>HdU 5</code> (CRM Integration) in the E2 informe; renumbered to <code>HU 4</code> following the E4 plan.</li></ul>","acs":[{"code":"E1","title":"Automatic derivation of high-priority leads to the CRM","body":"<p><strong>Given</strong> a user has been submitted into the application,</p><p><strong>When</strong> they finish being scored and are classified as high priority,</p><p><strong>Then</strong> the system must replicate their information into the CRM, immediately or eventually.</p>"},{"code":"E2","title":"Update the lead in the CRM on score/priority changes","body":"<p><strong>Given</strong> a user has been submitted into the application,</p><p><strong>When</strong> an update to their score occurs and they become qualified or their priority increases,</p><p><strong>Then</strong> the system must send a request to the CRM to update the user's data.</p>"},{"code":"E3","title":"Internal retention of non-priority leads","body":"<p><strong>Given</strong> a user has been submitted into the application,</p><p><strong>When</strong> they finish being scored and are not considered high priority,</p><p><strong>Then</strong> the application must not send their profile to the CRM, and must manage their data internally until their score is updated.</p>"}],"up":[{"id":"HU3","oneSided":false,"why":"E1 derives a lead to the CRM once they &quot;finish being scored and are classified as high priority&quot;; that classification is HU 3 E2's output.","tag":"documented","backward":false}],"down":[],"propUp":[],"propDown":[],"flag":{"id":"HU4","wiki":"planned","evidence":["backend/app/scoring_engine/commercial_priority.py","docs/crm-integration.md"],"covered":[],"not_located":["E1","E2","E3"],"mark":null}},"HU5":{"id":"HU5","kind":"story","title":"Basic System Security","lede":"Cross-cutting hardening of the platform: input validation, endpoint protection, and safe error handling to protect users' financial information.","sprint":"Sprint 1","status":"🔜 Sprint 1","category":"Important","sp":8,"actor":"Admin Dev / System Administrator","story":"<p><strong>As</strong> a system administrator, <strong>I want</strong> the platform to implement validations, endpoint protection, and safe error handling, <strong>in order to</strong> protect users' financial information and reduce the risk of vulnerabilities.</p>","notes":"<ul><li>This is a foundational, cross-cutting story: its criteria apply to every endpoint that handles lead data, especially <code>POST /score</code>.</li><li>Relates to the risk <strong>&quot;Exposure of sensitive data&quot;</strong> and <strong>&quot;Authentication/authorization vulnerabilities&quot;</strong> — see <span class=\"xref-ext\">Riesgos técnicos</span>.</li><li>Complements the RNF <strong>Security</strong> and <strong>Data privacy</strong> attributes — see <span class=\"xref-ext\">Atributos de calidad</span>.</li><li>Auth/role enforcement is expanded in <a class=\"xref\" data-go=\"HU14\" href=\"#HU14\">HU 14</a> (Sprint 2).</li></ul>","acs":[{"code":"E1","title":"Input validation","body":"<p><strong>Given</strong> a user completes forms or consumes endpoints,</p><p><strong>When</strong> they send invalid, incomplete, or out-of-range data,</p><p><strong>Then</strong> the system must reject the request and show a controlled message.</p>"},{"code":"E2","title":"Protection against unsafe errors","body":"<p><strong>Given</strong> an error occurs in the backend,</p><p><strong>When</strong> the system responds to the user,</p><p><strong>Then</strong> it must not expose technical traces, SQL queries, tokens, or sensitive data.</p>"},{"code":"E3","title":"SQL injection prevention","body":"<p><strong>Given</strong> the system stores or queries financial information,</p><p><strong>When</strong> operations are executed against the database,</p><p><strong>Then</strong> parameterized queries, an ORM, or equivalent mechanisms must be used.</p>"}],"up":[],"down":[{"id":"HU1","oneSided":false},{"id":"HU3","oneSided":false},{"id":"HU14","oneSided":false},{"id":"HU30","oneSided":false}],"propUp":[],"propDown":[],"flag":null},"HU6":{"id":"HU6","kind":"story","title":"Privacy & Personal Data Management Panel","lede":"Documented for planning. A privacy panel inside the user's profile to manage consent, request actions on their data, and control how their information is used.","sprint":"Sprint 2","status":"🗓 Planned","category":"Desirable","sp":3,"actor":"Lead (registered user)","story":"<p><strong>As</strong> a registered user, <strong>I want</strong> to access a privacy panel within my profile, <strong>in order to</strong> manage my consent, request actions on my data, and control the use of my information.</p>","notes":"<ul><li>Implements the ARSOBP data-subject rights referenced in the ethics commitment and the RNF <strong>Data privacy</strong> attribute — see <span class=\"xref-ext\">Atributos de calidad</span>.</li><li>Consent state set here gates event logging in <a class=\"xref\" data-go=\"HU23\" href=\"#HU23\">HU 23</a> E3.</li><li>Scope of privacy flows is validated in <strong>Spike 2</strong>.</li></ul>","acs":[{"code":"E1","title":"Consent management","body":"<p><strong>Given</strong> the user accesses their profile,</p><p><strong>When</strong> they enter the privacy panel,</p><p><strong>Then</strong> they must be able to view and modify the consent associated with the use of their data.</p>"},{"code":"E2","title":"Download or rectification request","body":"<p><strong>Given</strong> the user wants to exercise their rights over their data,</p><p><strong>When</strong> they choose to download or rectify personal information,</p><p><strong>Then</strong> the system must register the request and show a confirmation.</p>"},{"code":"E3","title":"Account deletion","body":"<p><strong>Given</strong> the user requests to delete their account,</p><p><strong>When</strong> they confirm the action,</p><p><strong>Then</strong> the system must start the total, unrecoverable deletion process according to the defined rules.</p>"},{"code":"E4","title":"Password recovery","body":"<p><strong>Given</strong> the user forgot their password or wants to change it,</p><p><strong>When</strong> they request recovery,</p><p><strong>Then</strong> the system must allow starting the reset flow.</p>"}],"up":[{"id":"HU1","oneSided":false,"why":"E1 lets the user view and modify &quot;the consent associated with the use of their data&quot;. That consent record is created by HU 1 E3.","tag":"documented","backward":false}],"down":[{"id":"HU23","oneSided":false}],"propUp":[],"propDown":[],"flag":{"id":"HU6","wiki":"planned","evidence":["frontend/src/components/AdminArcoRequests.jsx","frontend/src/services/arcoService.js","frontend/src/components/DataConsent.jsx","supabase/migrations/20260608_arco_requests.sql"],"covered":["E1","E2"],"not_located":["E3"],"mark":"ahead"}},"HU7":{"id":"HU7","kind":"story","title":"Personalized Improvement Plan Generator","lede":"For leads that don't yet qualify, the system generates a personalized, step-by-step action plan based on their specific financial profile — including targeted debt-payment and down-payment savings goals. The plan turns a &quot;not ready&quot; result into a structured path toward purchase readiness.","sprint":"Sprint 1","status":"✅ Implemented (PMV)","category":"Important","sp":8,"actor":"Lead","story":"<p><strong>As</strong> a lead in the preparation stage, <strong>I want</strong> to receive a personalized improvement plan with recommendations and debt/savings goals, <strong>in order to</strong> know what actions I must take to get closer to my real estate objective.</p>","notes":"<ul><li>The improvement plan is generated by <code>generate_improvement_plan()</code> in <code>backend/app/scoring.py</code>. It is currently a deterministic mock based on <code>risk_codes</code> — the same interface used by the AI explanation layer.</li><li>Available <code>risk_codes</code>: <code>ingreso_dividendo</code>, <code>deuda_alta</code>, <code>ahorro_bajo</code>, <code>precio_objetivo</code>, <code>contrato_independiente</code>, <code>continuidad_baja</code>, <code>continuidad_media</code>, <code>morosidad_alta</code>, <code>morosidad_media</code>.</li><li>The plan is returned as the <code>improvement_plan</code> array in the <code>POST /score</code> response and stored in <code>evaluations.recommendations.improvement_plan</code>.</li><li>Debt/savings goals (E5–E7) are tracked over time in <a class=\"xref\" data-go=\"HU8\" href=\"#HU8\">HU 8</a> and map to the <code>improvement_goals</code> table. See <span class=\"xref-ext\">improvement_goals</span>.</li><li>Users with a High score bypass this flow and are routed to the executive dashboard (see <a class=\"xref\" data-go=\"HU2\" href=\"#HU2\">HU 2</a> and <a class=\"xref\" data-go=\"HU3\" href=\"#HU3\">HU 3</a> E6).</li><li><strong>Numbering note:</strong> this story was documented as <code>HdU 4</code> in the E2 informe; the E4 plan renumbers it to <code>HU 7</code> (with expanded criteria E5–E7).</li></ul>","acs":[{"code":"E1","title":"Personalized plan generation","body":"<p><strong>Given</strong> a user does not meet the conditions to buy their real estate objective,</p><p><strong>When</strong> they finish their financial assessment,</p><p><strong>Then</strong> the system must generate a step-by-step improvement plan based on their data.</p>"},{"code":"E2","title":"Personalized recommendations","body":"<p><strong>Given</strong> the user has received their score,</p><p><strong>When</strong> the system identifies improvement opportunities,</p><p><strong>Then</strong> it must generate recommendations related to savings, debt, employment continuity, timeline, or real estate objective.</p>"},{"code":"E3","title":"Prioritization by impact","body":"<p><strong>Given</strong> several recommendations are available,</p><p><strong>When</strong> the user views their result,</p><p><strong>Then</strong> the system must order them according to their estimated impact.</p>"},{"code":"E4","title":"Expected benefit","body":"<p><strong>Given</strong> the user reviews a recommendation,</p><p><strong>When</strong> it is shown on screen,</p><p><strong>Then</strong> it must indicate the expected benefit of applying it.</p>"},{"code":"E5","title":"Debt-payment plan","body":"<p><strong>Given</strong> the user has active debts that affect their financial score,</p><p><strong>When</strong> the system generates the personalized improvement plan,</p><p><strong>Then</strong> it must create a debt-payment proposal indicating target amount, payment priority, and estimated timeframe to reduce their financial burden.</p>"},{"code":"E6","title":"Debt-payment ordering","body":"<p><strong>Given</strong> the user has more than one registered debt,</p><p><strong>When</strong> they view their improvement plan,</p><p><strong>Then</strong> the system must order the debts by their impact on the score, outstanding amount, or payment urgency, to guide the user on which to address first.</p>"},{"code":"E7","title":"Down-payment savings plan","body":"<p><strong>Given</strong> the user does not have enough savings to cover the required down payment (pie) of their real estate objective,</p><p><strong>When</strong> the system generates the improvement plan,</p><p><strong>Then</strong> it must propose a monthly savings goal and an estimated timeframe to reach the required amount.</p>"}],"up":[{"id":"HU2","oneSided":false,"why":"This story's high-score branch routes the lead away from the plan and into the executive dashboard — <em>&quot;Users with a High score bypass this flow and are routed to the executive dashboard&quot;</em> — so HU 2 must exist as the destination.","tag":"inferred · S6","backward":false},{"id":"HU3","oneSided":false,"why":"E1 generates the plan &quot;when they finish their financial assessment&quot;, and E2 keys recommendations off the <code>risk_codes</code> HU 3's engine produces.","tag":"documented","backward":false}],"down":[{"id":"HU8","oneSided":false},{"id":"HU12","oneSided":false},{"id":"HU29","oneSided":false}],"propUp":[],"propDown":[],"flag":null},"HU8":{"id":"HU8","kind":"story","title":"Monthly Improvement-Plan Tracking","lede":"Documented for planning. Lets a lead with an active improvement plan record monthly financial progress, see whether they are on track, and have their score recalculated as milestones are met.","sprint":"Sprint 2","status":"🗓 Planned","category":"Important","sp":5,"actor":"Lead","story":"<p><strong>As</strong> a lead with an active improvement plan, <strong>I want</strong> to record my monthly financial progress and update my situation, <strong>in order to</strong> know whether I am advancing correctly toward my real estate objective.</p>","notes":"<ul><li>Milestones and goals map to the <code>improvement_goals</code> table — see <span class=\"xref-ext\">improvement_goals</span>.</li><li>Recalculations (E4) must produce a new versioned evaluation rather than mutate the prior one — see <a class=\"xref\" data-go=\"HU33\" href=\"#HU33\">HU 33</a>.</li><li>Frontend counterparts: <code>FinancialTracking.jsx</code>, <code>MonthlyPlan.jsx</code>.</li></ul>","acs":[{"code":"E1","title":"Monthly progress recording","body":"<p><strong>Given</strong> the user has an active plan,</p><p><strong>When</strong> they record paid debts or amount saved,</p><p><strong>Then</strong> the system must update their monthly progress and show whether they are ahead, on schedule, or behind relative to their plan.</p>"},{"code":"E2","title":"Eligibility projection","body":"<p><strong>Given</strong> the user updates their financial progress,</p><p><strong>When</strong> the system recalculates their situation,</p><p><strong>Then</strong> it must show an estimated date of eligibility or approach to the objective.</p>"},{"code":"E3","title":"Plan status update","body":"<p><strong>Given</strong> the user has an active improvement plan,</p><p><strong>When</strong> they record progress, complete milestones, or miss planned activities,</p><p><strong>Then</strong> the system must update the plan status using states such as &quot;Not started&quot;, &quot;In progress&quot;, &quot;Partial progress&quot;, &quot;Completed&quot;, or &quot;Needs adjustment&quot;.</p>"},{"code":"E4","title":"Recalculate scoring on milestone completion","body":"<p><strong>Given</strong> the user records the completion of a financial milestone (debt payment or increased savings),</p><p><strong>When</strong> the system validates that progress,</p><p><strong>Then</strong> it must recalculate the financial score and update the user's classification if applicable.</p>"},{"code":"E5","title":"Milestone entry and validation","body":"<p><strong>Given</strong> the user wants to record progress within their improvement plan,</p><p><strong>When</strong> they enter a financial milestone such as paid debt, accumulated savings, or improved employment continuity,</p><p><strong>Then</strong> the system must validate that the entered data is consistent, positive, and does not contradict previously registered financial information.</p>"}],"up":[{"id":"HU7","oneSided":false,"why":"E1 records progress against &quot;an active plan&quot;; the plan and its debt/savings goals are HU 7 E5–E7. HU 7's note: <em>&quot;Debt/savings goals (E5–E7) are tracked over time in HU 8.&quot;</em>","tag":"documented","backward":false},{"id":"HU33","oneSided":false,"why":"E4 recalculates the score on milestone completion, and this story's note requires that recalculati ,"title":"Minimum adjustments to qualify","body":"<p><strong>Given</strong> the user does not qualify for their declared objective,</p><p><strong>When</strong> the system evaluates alternatives,</p><p><strong>Then</strong> it must propose the minimum change that would make a property accessible.</p>"},{"code":"E3","title":"Scenario comparison","body":"<p><strong>Given</strong> the user simulates different configurations,</p><p><strong>When</strong> the system presents the results,</p><p><strong>Then</strong> it must clearly show the difference between the current scenario and the alternative scenarios.</p>"},{"code":"E4","title":"Purchase-capacity estimation","body":"<p><strong>Given</strong> the user received their assessment,</p><p><strong>When</strong> they view the result,</p><p><strong>Then</strong> the system must show the maximum estimated home value they could finance.</p>"},{"code":"E5","title":"Maximum response time","body":"<p><strong>Given</strong> the user runs the compatibility simulation,</p><p><strong>When</strong> it finishes,</p><p><strong>Then</strong> it must not exceed a response time of 30 seconds.</p>"}],"up":[{"id":"HU3","oneSided":false,"why":"E1 tests scenarios against the lead's purchase capacity and E2 proposes minimum adjustments for someone who &quot;does not qualify&quot; — both need the completed assessment from HU 3.","tag":"documented","backward":false}],"down":[{"id":"HU10","oneSided":false},{"id":"HU13","oneSided":false},{"id":"HU30","oneSided":false}],"propUp":[],"propDown":[],"flag":null},"HU10":{"id":"HU10","kind":"story","title":"Real Estate Accessibility Map Visualization","lede":"Documented for planning. A map of the Región Metropolitana with sectors classified by the lead's financial capacity, so they can see visually where they could buy today and where they are out of reach.","sprint":"Sprint 3","status":"🗓 Planned","category":"Optional","sp":8,"actor":"Lead","story":"<p><strong>As</strong> a user who completed their assessment, <strong>I want</strong> to visualize a map of the Región Metropolitana with sectors classified according to my financial capacity, <strong>in order to</strong> understand visually where I could buy today and where I am out of reach.</p>","notes":"<ul><li>Reuses the compatibility logic from <a class=\"xref\" data-go=\"HU9\" href=\"#HU9\">HU 9</a> and the <code>PRECIOS_REFERENCIA_UF</code> comuna reference from the scoring engine.</li><li>The map recomputes dynamically as the lead changes conditions — see <a class=\"xref\" data-go=\"HU11\" href=\"#HU11\">HU 11</a>.</li></ul>","acs":[{"code":"E1","title":"Visual classification by neighborhood","body":"<p><strong>Given</strong> the user completed their assessment,</p><p><strong>When</strong> they access the map,</p><p><strong>Then</strong> each neighborhood must be shown as accessible, close, or out of reach according to their financial profile.</p>"},{"code":"E2","title":"Reason for the result","body":"<p><strong>Given</strong> a neighborhood appears as close or out of reach,</p><p><strong>When</strong> the user selects it,</p><p><strong>Then</strong> the system must show the main reason for the result.</p>"},{"code":"E3","title":"Heat-map visualization","body":"<p><strong>Given</strong> the lead opens the heat map,</p><p><strong>When</strong> the system crosses their score with the available sectors,</p><p><strong>Then</strong> it must mark in green the sectors where they can and want to buy, in yellow where it is unlikely, and in red the unreachable sectors.</p>"},{"code":"E4","title":"Explanation of results","body":"<p><strong>Given</strong> the user got a segment or project in &quot;yellow&quot; or &quot;red&quot;,</p><p><strong>When</strong> they click on it,</p><p><strong>Then</strong> the system must explain how much more income, savings, or financial improvement they need to access that sector or project.</p>"}],"up":[{"id":"HU3","oneSided":false,"why":"E3 &quot;crosses their score with the available sectors&quot; to colour the heat map; the score is HU 3's output.","tag":"documented","backward":false},{"id":"HU9","oneSided":false,"why":"This story's note: <em>&quot;Reuses the compatibility logic from HU 9.&quot;</em> E1's accessible / close / out-of-reach classification is HU 9's compatibility test applied per comuna.","tag":"documented","backward":false}],"down":[{"id":"HU11","oneSided":false}],"propUp":[],"propDown":[],"flag":null},"HU11":{"id":"HU11","kind":"story","title":"Dynamic Accessibility-Map Update","lede":"Documented for planning. Automatically refreshes the accessibility map when the lead changes their financial conditions or purchase preferences, so they can compare how their options shift.","sprint":"Sprint 3","status":"🗓 Planned","category":"Optional","sp":5,"actor":"Lead","story":"<p><strong>As</strong> a user who modifies their financial conditions or purchase preferences, <strong>I want</strong> the accessibility map to update automatically, <strong>in order to</strong> compare how my housing options change according to my score, income, term, or property type.</p>","notes":"<ul><li>Extends <a class=\"xref\" data-go=\"HU10\" href=\"#HU10\">HU 10</a> with reactive recomputation; no new classification logic.</li></ul>","acs":[{"code":"E1","title":"Re-evaluation when score/income changes","body":"<p><strong>Given</strong> a user has improved their score or income,</p><p><strong>When</strong> they re-enter the map,</p><p><strong>Then</strong> the system must recompute the segments or projects and change the map colors accordingly.</p>"},{"code":"E2","title":"Update by levers","body":"<p><strong>Given</strong> the user adjusts term, property type, or first-home condition,</p><p><strong>When</strong> they modify those parameters,</p><p><strong>Then</strong> the map must update the accessibility result.</p>"}],"up":[{"id":"HU10","oneSided":false,"why":"This story's note: <em>&quot;Extends HU 10 with reactive recomputation; no new classification logic. >Given</strong> the user views concepts such as down payment, rate, subsidy, or term,</p><p><strong>When</strong> these appear in the result, plan, or map,</p><p><strong>Then</strong> the system must offer direct access to the corresponding content.</p>"}],"up":[{"id":"HU3","oneSided":false,"why":"E2 triggers on &quot;an identified financial blocker&quot;; this story's note says blocker detection <em>&quot;reuses the <code>risk_codes</code> produced by the scoring engine (HU 3)&quot;</em>.","tag":"documented","backward":false},{"id":"HU7","oneSided":false,"why":"E2 fires when the user reviews &quot;their result <strong>or improvement plan</strong>&quot; — the plan is HU 7's artifact, and this story's note names it alongside HU 3 as the source of blocker detection.","tag":"documented · B1","backward":false}],"down":[],"propUp":[],"propDown":[],"flag":{"id":"HU12","wiki":"next","evidence":["frontend/src/components/AcademiaFinanciera.jsx","frontend/src/constants/academyContent.js","frontend/src/components/GlossaryTerm.jsx"],"covered":["E1","E3"],"not_located":["E2"],"mark":null}},"HU13":{"id":"HU13","kind":"story","title":"Lead–Project Matching for Sales Executives","lede":"Suggests leads compatible with the projects an executive sells, ranked by affinity and purchase capacity — surfacing opportunities even when a lead's general classification isn't High.","sprint":"Sprint 1","status":"🔜 Sprint 1","category":"Important","sp":5,"actor":"Sales Executive","story":"<p><strong>As</strong> a sales executive, <strong>I want</strong> the system to suggest leads compatible with the projects I sell, <strong>in order to</strong> prioritize prospects with a higher probability of conversion.</p>","notes":"<ul><li>Matching criteria (estimated capacity, comuna, price range, down payment, classification, main blocker) are defined in <strong>Spike 1</strong>.</li><li>Requires the project catalog from <a class=\"xref\" data-go=\"HU17\" href=\"#HU17\">HU 17</a> to know which projects are
